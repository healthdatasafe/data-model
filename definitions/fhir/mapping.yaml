# Pack-level FHIR mapping tables (plan 115). Published as `pack.fhirMapping`; read by the
# build to validate every item's `fhir:` block. See documentation/FHIR-MAPPING.md.
#
# This file is the ONE place these tables live: hds-fhir-js and any second implementer read
# them from the pack. Entries are additive; a published category or system label is never
# renamed or removed.

# Version of the `fhir:` block format and of this table. A consumer that does not know a
# formatVersion should not render the blocks; within a version it skips any block whose
# resourceType, value kind or code source it does not know.
formatVersion: 1

fhirVersion: 4.0.1

# Rendering flavour → the implementation guide (package#version) its profiles come from.
flavours:
  us: hl7.fhir.us.core#6.1.0
  ips: hl7.fhir.uv.ips#2.0.1
  ch: ch.fhir.ig.ch-core#6.0.0

# Category keys per resourceType. A block on one of these resourceTypes must carry a
# `category` from its table; a resourceType absent from this table (Patient) takes no category.
# The key is the SMART scope category (`patient/Observation.rs?category=<key>`). The scope
# key in pack.fhirScopes is `ResourceType|category` for a resourceType with a table, and the
# bare resourceType otherwise (`Patient`, granted for `patient/Patient.rs`).
categories:
  Observation:
    vital-signs: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: vital-signs, display: Vital Signs }
    social-history: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: social-history, display: Social History }
    survey: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: survey, display: Survey }
    laboratory: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: laboratory, display: Laboratory }
    exam: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: exam, display: Exam }
    imaging: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: imaging, display: Imaging }
    procedure: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: procedure, display: Procedure }
    therapy: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: therapy, display: Therapy }
    activity: { system: http://terminology.hl7.org/CodeSystem/observation-category, code: activity, display: Activity }
  Condition:
    problem-list-item: { system: http://terminology.hl7.org/CodeSystem/condition-category, code: problem-list-item, display: Problem List Item }
    encounter-diagnosis: { system: http://terminology.hl7.org/CodeSystem/condition-category, code: encounter-diagnosis, display: Encounter Diagnosis }
    health-concern: { system: http://hl7.org/fhir/us/core/CodeSystem/condition-category, code: health-concern, display: Health Concern }
  # The one key of the US Core DocumentReference category value set (4.2.0, plan 115 GAP H-8): every HDS document is
  # a clinical note in this sense, whatever its XDS class (which rides as a second `category` coding). A grant on
  # `DocumentReference|clinical-note` covers every document, as a grant on `documents` does.
  DocumentReference:
    clinical-note: { system: http://hl7.org/fhir/us/core/CodeSystem/us-core-documentreference-category, code: clinical-note, display: Clinical Note }

# Code-system label used in datasets-service content (`codes[].system`) → canonical URI.
# One label per URI, so an imported coding maps back to exactly one label.
systems:
  SNOMED-CT: http://snomed.info/sct
  ICD-10: http://hl7.org/fhir/sid/icd-10
  LOINC: http://loinc.org
  ATC: http://www.whocc.no/atc
  RxNorm: http://www.nlm.nih.gov/research/umls/rxnorm

# National product code system (`drug.product.system`, MEDICATION.md § National products) → the URI its product
# code renders under, as the second coding of a medication concept. The labels are the `drug.product.system` enum
# of the coded medication eventTypes (the build holds the two together). Plan 115, medications slice:
# - Swissmedic: an HDS identifier namespace. Swissmedic publishes no canonical URI for the authorisation number plus
#   sequence HDS stores (CH IDMP and CH EPL draft a NamingSystem for the 5-digit authorisation number alone,
#   `http://fhir.ch/ig/ch-idmp/sid/authno`; CH EMED codes products by GTIN, `urn:oid:2.51.1.1`).
# - CIS: the ANS "Serveur Multi-Terminologies" publishes the BDPM as a FHIR CodeSystem whose specialite concepts are
#   coded by their CIS. Checked 2026-11-13: `GET https://smt.esante.gouv.fr/fhir/CodeSystem/$lookup?system=https://smt.esante.gouv.fr/terminologie-bdpm&code=60234100`
#   answers "DOLIPRANE 1000 mg, comprimé" (CodeSystem version 2026-11-03, 41 257 concepts, status active), and the
#   ANSM BDPM gives that specialite the code CIS 6 023 410 0
#   (https://base-donnees-publique.medicaments.gouv.fr/medicament/60234100/extrait). The same CodeSystem also holds
#   the presentations under their CIP13 (3400935955838 is its box of 8), so on import only an 8-digit code under it
#   is a CIS; a CIP13 is refused (hds-fhir-js `fromFhir`).
#   Precedent: the ANS document-core IG (`ans.fhir.fr.document-core`, draft 0.1.0, FR Immunization Document) slices
#   `vaccineCode.coding:cis` with `system` patternUri `https://smt.esante.gouv.fr/terminologie-bdpm`, so the ANS itself
#   emits CIS codes under this URI. Not taken: `http://data.esante.gouv.fr/ansm/medicament/SpecialitePharmaceutique`
#   from the ANS ePrescription ballot (1.1.0), which resolves nowhere (no CodeSystem on the SMT, no package defines it);
#   if it is ever published, an importer can accept it as well without changing the URI emitted here. No
#   `Coding.version` is emitted: a CIS is assigned once and never changes. The BDPM lists only the products marketed in
#   the last five years, so the CIS of a medicine withdrawn earlier can fail `$validate-code` on the live server while
#   remaining a correct code.
productSystems:
  Swissmedic: https://hds.ngo/fhir/sid/swissmedic
  CIS: https://smt.esante.gouv.fr/terminologie-bdpm
