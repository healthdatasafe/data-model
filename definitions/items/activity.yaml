# Physical activity items — self-reported exercise tracking.
# See documentation/PHYSICAL-ACTIVITY.md for cross-system compatibility.
#
# Model (Plan 77 / data-model#19):
#   - <activity>            : presence marker (eventType activity/plain). `deprecated: true`
#                            here means "hidden from pickers", NOT "do not write": presence-only
#                            sources are expected to keep writing it. The published `description`
#                            says so too (site-agents#13, 2026-09-15).
#   - <activity>-intensity : go-forward item (eventType ratio/proportion, WHO/ACSM 3-level
#                            Light/Moderate/Vigorous). Write it only when an intensity is known;
#                            note these options are 0.25/0.5/1.0 — there is no 0.
# Both itemDefs share the same streamId (identity is streamId:eventType).
# Maps to Apple HealthKit HKWorkoutActivityType and SNOMED CT codes.

## Yoga
activity-yoga:
  version: v1
  label: Yoga
  description: Presence marker for sources that record occurrence only (no grade); use activity-yoga-intensity when an intensity is known.
  deprecated: true
  streamId: activity-yoga
  eventType: activity/plain
  type: checkbox
  repeatable: unlimited

activity-yoga-intensity:
  version: v1
  label:
    en: Yoga
    fr: Yoga
  description:
    en: Yoga session, with intensity.
    fr: Séance de yoga, avec intensité.
  streamId: activity-yoga
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.25
      label:
        en: Light intensity
        fr: Intensité légère
    - value: 0.5
      label:
        en: Moderate intensity
        fr: Intensité modérée
    - value: 1.0
      label:
        en: Vigorous intensity
        fr: Intensité élevée
  repeatable: unlimited

