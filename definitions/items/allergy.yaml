allergy-coded:
  version: v1
  label:
    en: Allergy or intolerance (coded)
    fr: Allergie ou intolérance (codée)
  description:
    en: Search and select what you are allergic or intolerant to.
    fr: Recherchez et sélectionnez ce à quoi vous êtes allergique ou intolérant.
  streamId: allergy
  eventType: allergy/coded-v1
  type: composite
  composite:
    allergen:
      label: { en: Allergen, fr: Allergène }
      type: datasource-search
      datasource: allergen
    # The fields below are the same on allergy-basic (anchors): one definition for both twins.
    status: &allergy-status
      label: { en: Status, fr: Statut }
      type: select
      options:
        - value: active
          label: { en: Active, fr: Active }
        - value: inactive
          label: { en: Inactive, fr: Inactive }
        - value: resolved
          label: { en: Resolved, fr: Résolue }
    verificationStatus: &allergy-verification-status
      label: { en: Verification, fr: Vérification }
      type: select
      canBeNull: true
      options:
        - value: unconfirmed
          label: { en: Suspected (not confirmed), fr: Suspectée (non confirmée) }
        - value: confirmed
          label: { en: Confirmed (by a test or a doctor), fr: Confirmée (par un test ou un médecin) }
    categories: &allergy-categories
      label: { en: Category, fr: Catégorie }
      type: multi-select
      canBeNull: true
      options:
        - value: food
          label: { en: Food, fr: Aliment }
        - value: medication
          label: { en: Medication, fr: Médicament }
        - value: environment
          label: { en: "Environment (pollen, animals, dust…)", fr: "Environnement (pollens, animaux, poussière…)" }
        - value: biologic
          label: { en: "Biologic product (vaccine, blood product…)", fr: "Produit biologique (vaccin, produit sanguin…)" }
    type: &allergy-type
      label: { en: Type, fr: Type }
      type: select
      canBeNull: true
      options:
        - value: allergy
          label: { en: Allergy, fr: Allergie }
        - value: intolerance
          label: { en: Intolerance, fr: Intolérance }
    criticality: &allergy-criticality
      label: { en: Risk of a severe reaction, fr: Risque de réaction grave }
      type: select
      canBeNull: true
      options:
        - value: low
          label: { en: Low, fr: Faible }
        - value: high
          label: { en: High, fr: Élevé }
        - value: unable-to-assess
          label: { en: Cannot be assessed, fr: Impossible à évaluer }
    lastOccurrence: &allergy-last-occurrence
      label: { en: Last reaction, fr: Dernière réaction }
      type: date
      canBeNull: true
    notes: &allergy-notes
      label: { en: Notes, fr: Notes }
      type: text
      canBeNull: true
  repeatable: unlimited
  # An AllergyIntolerance (US Core 6.1.0 on `us`, IPS 2.0.1 on `ips`; documentation/FHIR-MAPPING.md § AllergyIntolerance):
  # the coded allergen (`allergen.codes`, through fhirMapping.systems) is `code`, the event time `onsetDateTime`. A bare
  # scope key (`AllergyIntolerance`): no category table, so the content `categories` is never a scope category. The
  # other fields render by name (status, verificationStatus, categories, type, criticality, lastOccurrence, notes, and
  # the non-form reactions).
  fhir:
    resourceType: AllergyIntolerance
    code: { from: datasource, field: allergen }
    profiles: &allergy-profiles
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-allergyintolerance
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/AllergyIntolerance-uv-ips
  devNotes: >-
    event.time is the onset, at its precision (PARTIAL-DATES.md); hdsTimePrecision: unknown when the person does not
    know it. No duration in v1: time + duration is reserved for an abatement, as on condition-coded, and an event that
    carries one is refused by the FHIR rendering. `status` is required: the item format has no default value, so the
    entry UI presets it to active; a writer that is not a form (a bridge, the MCP import) states it and never defaults
    it. `verificationStatus` absent = not stated; never defaulted to confirmed. `reactions` (allergy/coded-v1) is not a
    form field: an array of objects, which no composite field type holds (as procedure `findings`); a writer that has
    reactions writes them itself, and the entry UI adds a repeating group later, the stored shape being fixed now. At
    least one code (`allergen.codes` minItems 1): an allergen no code was found for is allergy-basic. The entry UI
    must write no `categories` key for an empty multi-select, never `categories: []` (minItems 1), and must write
    `lastOccurrence` as YYYY, YYYY-MM or YYYY-MM-DD, never a full ISO datetime, with a way to enter a year or a month
    alone (a plain date widget allows neither). An allergy pass
    as a document is the `allergy-record` document kind (documentKinds.yaml), on `documents`, not here. "No known
    allergy" is a later item (allergy-none-known), never an allergen. See documentation/ALLERGY.md.

allergy-basic:
  version: v1
  label:
    en: Allergy or intolerance (free-text)
    fr: Allergie ou intolérance (texte libre)
  description:
    en: Something you are allergic or intolerant to, entered as free text.
    fr: Ce à quoi vous êtes allergique ou intolérant, saisi en texte libre.
  streamId: allergy
  eventType: allergy/basic-v1
  type: composite
  composite:
    name:
      label: { en: Allergen, fr: Allergène }
      type: text
    status: *allergy-status
    verificationStatus: *allergy-verification-status
    categories: *allergy-categories
    type: *allergy-type
    criticality: *allergy-criticality
    lastOccurrence: *allergy-last-occurrence
    notes: *allergy-notes
  repeatable: unlimited
  # The name as written is `code.text`, no coding; the rest as the coded twin.
  fhir:
    resourceType: AllergyIntolerance
    code: { from: text, field: name }
    profiles: *allergy-profiles
  devNotes: >-
    The uncoded twin of allergy-coded: a name no code was found for (an allergen coded only in a system outside
    fhirMapping.systems, UNII or NDF-RT, imports here and loses its code), never a coded event with codes: []. Same
    stream, so one consent unit covers both. Every other field, and every rule of allergy-coded's devNotes (onset,
    no duration in v1, status stated by every writer, verification never defaulted to confirmed, reactions not a
    form field, no empty `categories` and `lastOccurrence` written as YYYY, YYYY-MM or YYYY-MM-DD by the entry UI),
    applies unchanged.
