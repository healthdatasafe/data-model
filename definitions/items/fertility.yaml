      min: P21D
      max: P35D
    cooldown: P10D
  devNotes: |-
    Cycle duration is determined by next fertility cycle date unless duration property is given.
    This item is what opens a new cycle;
    `fertility-cycles-period-end` records the last day of the bleeding.
fertility-cycles-period-end:
