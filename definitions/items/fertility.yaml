fertility-cycles-start:
  version: v1
  label:
    en: New Cycle
    fr: Nouveau cycle
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 7776000 # thershold for amenorrhea  90 days
  description:
    en: The first day of full bleeding (not just spotting), which starts a new cycle.
    fr: Le premier jour de vraies règles (pas de simples pertes), qui marque le début d'un nouveau cycle.
  streamId: fertility-cycles-start
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  reminder:
