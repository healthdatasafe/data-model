    alsoMatch: [{ system: http://loinc.org, code: 80384-1, display: "Choriogonadotropin [Presence] in Urine by Rapid immunoassay" }]
    value:
      kind: coded
      options:
        "-1": { system: http://snomed.info/sct, code: "260385009", display: Negative }
        "0": { system: http://snomed.info/sct, code: "82334004", display: Indeterminate }
        "1": { system: http://snomed.info/sct, code: "10828004", display: Positive }
      alsoMatch:
        "-1": [{ system: http://snomed.info/sct, code: "260415000", display: Not detected }]
        "0": [{ system: http://snomed.info/sct, code: "42425007", display: Equivocal }]
        "1": [{ system: http://snomed.info/sct, code: "260373001", display: Detected }]
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-laboratory-pathology-uv-ips

