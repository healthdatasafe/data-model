  # block's code is the HDS item coding (FHIR-MAPPING.md § code). Mira reports E3G in ng/mL;
  # 1 ng/mL = 1 μg/L, so the stored number is right on concentration/ug-l and renders in ng/mL.
  fhir:
    resourceType: Observation
