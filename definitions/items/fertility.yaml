fertility-cycles-charted-count:
  version: temporary
  deprecated: true
  label: Nb of charted cycles
  description: Number of total charted cycles at this date
  streamId: fertility-cycles-charted-estimation
  eventType: count/generic
  type: number
  repeatable: once
fertility-cycles-average-length:
  version: v1
  label:
    en: Average Cycle Length
    fr: Durée moyenne du cycle
  description:
    en: Your average menstrual cycle length, in days.
    fr: Votre durée moyenne de cycle menstruel, en jours.
  streamId: fertility-cycles-average-length
  eventType: time/d
  type: number
  repeatable: once
fertility-cycles-average-period:
  version: v1
  label:
    en: Average Period Length
    fr: Durée moyenne des règles
  description:
    en: Your average period length, in days.
    fr: Votre durée moyenne des règles, en jours.
  streamId: fertility-cycles-average-period
  eventType: time/d
  type: number
  repeatable: once
fertility-cycles-average-peak-day:
  version: v2
  label:
    en: Average mucus peak day
    fr: Jour sommet moyen de la glaire
  description:
    en: The cycle day on which your mucus Peak Day usually falls, as you recall it.
    fr: Le jour du cycle où tombe habituellement votre jour sommet de la glaire, selon votre souvenir.
  streamId: fertility-cycles-average-peak-day
  eventType: time/d
  type: number
  repeatable: once
  devNotes: |-
    The recalled average cycle day of the mucus Peak Day, the same Peak Day as `fertility-cycles-peak-day`
    (meaning fixed in 3.24.0, B-2026-10-26-19): never an LH peak, a fertility monitor's Peak reading or
    ovulation. The value is a cycle day number (day 1 = the `fertility-cycles-start` day), stored on
    `time/d`. A recalled summary: one event, `time` at the date the answer is given
    (MENSTRUAL-CYCLE.md § Recalled summaries). Chart notation as the person recalls it, not a statement
    of fertility. v2 since 4.11.0 (B-2026-10-28-7): v1 said "typical cycle day of peak fertility", so an
    answer given before 4.11.0 may be an LH or monitor peak. No LH twin: a recalled average LH peak day
    is never written here; it gets its own item if an intake ever asks for it.
fertility-cycles-average-luteal-phase:
  version: v1
  label:
    en: Average Luteal Phase Length
    fr: Durée moyenne de la phase lutéale
  description:
    en: Your typical luteal-phase length, in days (recalled average).
    fr: La durée type de votre phase lutéale, en jours (moyenne rappelée).
  streamId: fertility-cycles-average-luteal-phase
  eventType: time/d
  type: number
  repeatable: once
fertility-cycles-regularity:
  version: v1
  label:
    en: Cycle regularity
    fr: Régularité des cycles
  description:
    en: Whether your menstrual cycles are generally regular.
    fr: Si vos cycles menstruels sont généralement réguliers.
  streamId: fertility-cycles-regularity
  eventType: fertility/cycle-regularity-v1
  type: select
  options:
    - value: regular
      label: { en: Regular, fr: Réguliers }
    - value: irregular
      label: { en: Irregular, fr: Irréguliers }
    - value: no-periods
      label: { en: No current periods, fr: Pas de règles actuellement }
  repeatable: any
  references:
    snomed: ["364307006"]
  devNotes: >-
    A recalled summary of the cycles in the person's own words, beside the
    fertility-cycles-average-* family (site-agents#39): one event per answer, `time` at the date it
    is given (MENSTRUAL-CYCLE.md § Cycle regularity). For a person who charts, regularity can be derived
    from fertility-cycles-start; this item is for the answer given without a chart, and a reader
    prefers the derived value when both exist. "Not sure" is no answer and is not recorded.
    `no-periods` is what the person reports, never a diagnosis: do not derive amenorrhoea (a
    condition-coded entry) or a profile-reproductive-stage from it. SNOMED 364307006 is the
    observable "Regularity of menstrual cycle"; the option findings, for export, are 302757007
    Regular periods and 80182007 Irregular periods; `no-periods` has no code short of
    14302001 Amenorrhea, a clinical judgement the person has not stated, so it stays uncoded. That
    is why the item has no fhir block: a coded block must map every option. Never add one by coding
    `no-periods` as 14302001.
fertility-cycles-ovulation:
  version: v1
  label:
    en: Ovulation Day
    fr: Jour d'ovulation
  description:
    en: The day you ovulated.
    fr: Le jour de votre ovulation.
  streamId: fertility-cycles-ovulation
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: |-
    One event per cycle, `time` anywhere on the calendar day of ovulation, no duration.
    A source writing a *predicted* ovulation (Mira, until the cycle completes) sets
    `clientData.hdsBasis: 'predicted'` and updates the same event in place to `'confirmed'` once
    known; absent = not stated. Phases are derived from this item (hds-lib `cyclePhaseAt`); it is
    never a phase itself (see documentation/MENSTRUAL-CYCLE.md).
  # FHIR (plan 133): LOINC 11976-8 "Ovulation date" with the event's own date as valueDateTime (event-date). An
  # imported 11976-8 is an OB dating term, a recalled date: it lands as the ovulation it states. A predicted
  # ovulation (hdsBasis 'predicted') is never rendered.
  references:
    loinc: ["11976-8"]
  fhir:
    resourceType: Observation
    category: fertility
    alsoMatchCategories: [social-history, exam]
    code: { system: http://loinc.org, code: 11976-8, display: Ovulation date }
    value: { kind: event-date }
    profiles: {}
fertility-cycles-start:
  version: v1
  label:
    en: New Cycle
    fr: Nouveau cycle
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 7776000 # threshold for amenorrhea: 90 days
  description:
    en: The first day of full bleeding (not just spotting), which starts a new cycle.
    fr: Le premier jour de vraies règles (pas de simples pertes), qui marque le début d'un nouveau cycle.
  streamId: fertility-cycles-start
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  reminder:
    expectedInterval:
      min: P21D
      max: P35D
    cooldown: P10D
  devNotes: |-
    Cycle duration is determined by next fertility cycle date unless duration property is given.
    This item is what opens a new cycle;
    `fertility-cycles-period-end` records the last day of the bleeding.
    On the open (current) cycle, `duration` is always a prediction: only the next start ends a cycle.
    Same `clientData.hdsBasis` convention as `fertility-cycles-ovulation`, qualifying `time` (the day).
  # FHIR (plan 133): LOINC 8665-2 "Last menstrual period start date" with the event's own date as valueDateTime
  # (event-date). The duration (the cycle length, a prediction on the open cycle) is not exported. An EHR's last
  # menstrual period (filed under social-history, exam or no category) imports as the cycle start it states, a
  # recalled date.
  references:
    loinc: ["8665-2"]
  fhir:
    resourceType: Observation
    category: fertility
    alsoMatchCategories: [social-history, exam]
    code: { system: http://loinc.org, code: 8665-2, display: Last menstrual period start date }
    value: { kind: event-date }
    profiles: {}
fertility-cycles-period-end:
  version: v1
  label:
    en: End of period
    fr: Fin des règles
  description:
    en: Last day of your period.
    fr: Dernier jour de vos règles.
  streamId: fertility-cycles-period
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: |-
    To track start / end of period, use fertility-cycles-start & fertility-cycles-period-end.
    The FIRST day of a period is not recorded here: it is given by a new cycle indication
    (`fertility-cycles-start`).
    The stream is `fertility-cycles-period`, not the key: kept, a stream rename moves data.
    `time` is on the last bleeding day; the period is the `-start` day through this day inclusive.
    Same `clientData.hdsBasis` convention as `fertility-cycles-ovulation`.
  # FHIR (plan 133): a finding stated by its code alone, the HDS item coding (no LOINC or SNOMED CT concept), no value.
  fhir:
    resourceType: Observation
    category: fertility
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: fertility-cycles-period-end, display: End of period }
    profiles: {}
fertility-cycles-fertile-window:
  version: v1
  label:
    en: Fertile Window
    fr: Fenêtre fertile
  description:
    en: Your fertile window for this cycle.
    fr: Votre fenêtre fertile pour ce cycle.
  streamId: fertility-cycles-fertile-window
  eventType: activity/plain
  duration:
    mandatory: true
    canBeNull: false
    maxSeconds: 518400 # 6 days between first and last fertile day (7-day inclusive window)
  type: checkbox
  repeatable: P1D
  devNotes: |-
    Use duration property to indicate end of fertile window.
    `time` is on the first fertile day and `time + duration` on the last (both inclusive by calendar
    day): Mira's 7-day window is `duration` 6 d, the maximum. Same `clientData.hdsBasis` convention
    as `fertility-cycles-ovulation`.
  # FHIR (plan 133): the HDS item coding, no value; effectivePeriod from the first to the last fertile day.
  fhir:
    resourceType: Observation
    category: fertility
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: fertility-cycles-fertile-window, display: Fertile Window }
    effective: { from: span }
    profiles: {}
fertility-cycles-peak-day:
  version: v2
  label:
    en: Mucus peak day
    fr: Jour sommet de la glaire
  description:
    en: The last day of peak-type mucus in your cycle.
    fr: Le dernier jour de glaire de type sommet de votre cycle.
  streamId: fertility-cycles-peak-day
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: |-
    The mucus Peak Day of the fertility-awareness methods (Billings, Creighton, FEMM, Marquette,
    Sensiplan, STM, Peak Day tracking): the last day of peak-type cervical fluid, in the method's own
    terms, known in retrospect once the fluid changes. One event per cycle, `time` anywhere on that
    calendar day, no duration. Meaning fixed in 3.24.0 (B-2026-10-26-19): it is never the LH peak
    (`fertility-cycles-lh-peak-day`), a fertility monitor's Peak reading, or ovulation
    (`fertility-cycles-ovulation`). v2 since 3.24.0: events written before 3.24.0 by Cycle
    Intelligence (demo accounts only) may be LH peaks. Chart notation recorded by the person or a
    charting app, not a statement of fertility. See documentation/MENSTRUAL-CYCLE.md "Peak days".
  # FHIR (plan 133): the HDS item coding, no value.
  fhir:
    resourceType: Observation
    category: fertility
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: fertility-cycles-peak-day, display: Mucus peak day }
    profiles: {}
fertility-cycles-lh-peak-day:
  version: v1
  label:
    en: LH peak day
    fr: Jour du pic de LH
  description:
    en: The day your LH surge peaked, on a urine test or a monitor.
    fr: Le jour du pic de votre LH, sur un test urinaire ou un moniteur.
  streamId: fertility-cycles-lh-peak-day
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: |-
    The peak of the luteinizing-hormone surge, as the person (or an app) marks it from urine LH
    tests (`fertility-test-opk`, `body-urine-hormones-lh`) or a fertility monitor. One event per
    cycle, `time` anywhere on that calendar day, no duration. Distinct from the mucus Peak Day
    (`fertility-cycles-peak-day`): the two usually fall a day or two apart and either can be
    recorded without the other. Added in 3.24.0 (B-2026-10-26-19). A sibling stream, not a child of
    `fertility-cycles-peak-day`, so a permission on one never grants the other. No LOINC or SNOMED
    CT concept found for it (2026-10-28). HealthKit has no peak-day sample:
    `HKCategoryValueOvulationTestResult.luteinizingHormoneSurge` is a per-test result and maps to
    `fertility-test-opk`. FHIR: a locally coded Observation (plan 133: the HDS item coding, no value).
  fhir:
    resourceType: Observation
    category: fertility
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: fertility-cycles-lh-peak-day, display: LH peak day }
    profiles: {}
fertility-cycles-coverline:
  version: v1
  label:
    en: Coverline
    fr: Ligne de couverture
  description:
    en: The temperature line drawn on this cycle's chart.
    fr: La ligne de température tracée sur la courbe de ce cycle.
  streamId: fertility-cycles-coverline
  eventType: temperature/c
  type: number
  repeatable: P1D
  devNotes: |-
    The basal-temperature coverline of one cycle, in °C. One event per cycle, `time` on the
    calendar day of that cycle's `fertility-cycles-start` (the patient's time zone), no duration.
    `clientData.hdsBasis` says where the value comes from: 'manual' (the person drew or moved the
    line) or 'auto' (computed by the method's coverline rule, see the converter's
    `temperatureRule`, and stored as computed); absent = not stated. Precedence, one rule: a
    reader that computes the line shows a 'manual' event if there is one, otherwise its own
    computation, never a stored 'auto'; a reader that cannot compute shows whichever event exists.
    An 'auto' event is written only by the writer that owns the cycle's data (an import), and
    replaced by that writer; apps that compute never store 'auto'. Going back to the method's rule
    deletes the event. Recommended: `clientData.related.<cycleStartEventId>: true`, so a moved
    start does not orphan the line; if the cycle start moves, the writer moves the coverline with
    it. Chart notation, never a fertility verdict. Added in 3.24.0; see
    documentation/MENSTRUAL-CYCLE.md "Coverline".
fertility-cycles-chart-stamp:
  version: v1
  label:
    en: Cycle chart stamp
    fr: Timbre du tableau de cycle
  description:
    en: The stamp put on your chart for this day.
    fr: Le timbre posé sur votre tableau pour ce jour.
  streamId: fertility-cycles-chart-stamp
  eventType: fertility/chart-stamp-v1
  type: imported
  repeatable: P1D
  devNotes: |-
    The stamp (sticker) a person or her instructor put on a day of a stamp-based chart (Creighton,
    Billings), kept as charted (site-agents#67). One event per day and method, `time` anywhere on that
    calendar day, no duration. `method` is the charting method's id, as `content.source.key` of a mucus
    observation; `stamp` names the whole stamp.
    Chart notation, never a fertility verdict: no reader derives a fertile or infertile day from it, and
    it is never an input of a conversion or a score. A reader that does not know the method or the stamp
    draws its own. It belongs to the day, not to one observation: a day
    may hold a stamp and no code. A reader drawing a chart of `method` shows it in place of the stamp it
    would draw; it changes no other method's chart. Deleting the event brings the drawn stamp back.
    An app never stores a stamp it drew itself (a corrected code would keep the old stamp): only one the
    person picked or an import read. `yellow` and `yellow-baby` are used on the instructor's
    instruction only, so an app offers them only to a person who asked for them, and never proposes one.
    The peak mark (`fertility-cycles-peak-day`) and the count days (derived) are not part of it.
    `type: imported` keeps it out of generic pickers and forms: a person enters it in a chart's own
    stamp control. Added in 4.32.0; see documentation/MENSTRUAL-CYCLE.md "Charted stamp".
fertility-miscarriages-count:
  version: temporary
  deprecated: true
  label: Nb of miscarriages
  description: |-
    DEPRECATED — record each miscarriage as its own `fertility-pregnancy`
    event with `content = miscarriage`, `time = LMP for that pregnancy`, and
    `duration = LMP→outcome`. Aggregate counts are derived analyst-side from
    the count of such events. The legacy aggregate-count item (this one) is
    retained for backwards compatibility with pre-existing clients only.
  streamId: fertility-miscarriages
  eventType: count/generic
  type: number
  repeatable: once
fertility-ttc-tta:
  version: v1
  label:
    en: Trying to conceive / Avoiding pregnancy
    fr: Essai de conception / Évitement de grossesse
  description:
    en: Your current intention about becoming pregnant.
    fr: Votre intention actuelle concernant une grossesse.
  streamId: fertility-ttc-tta
  eventType: ratio/generic
  type: select
  options:
    - value: 0
      label:
        en: "TTA - Not taking risks. Would take all available measures to end a pregnancy."
        fr: "TTA — Aucun risque pris. Prendrait toutes les mesures disponibles pour interrompre une grossesse."
    - value: 1
      label:
        en: "TTA - Not taking risks. Would strongly consider placing baby for adoption."
        fr: "TTA — Aucun risque pris. Envisagerait fortement de confier le bébé à l'adoption."
    - value: 2
      label:
        en: "TTA - Not taking risks. Would need some time, maybe counseling. Ultimately keeping the pregnancy."
        fr: "TTA — Aucun risque pris. Aurait besoin de temps, peut-être d'un accompagnement, mais mènerait finalement la grossesse à terme."
    - value: 4
      label:
        en: "TTA - Not taking risks. Currently content with family size but a surprise pregnancy would be welcome."
        fr: "TTA — Aucun risque pris. Satisfait(e) de la taille actuelle de la famille, mais une grossesse surprise serait bienvenue."
    - value: 5
      label:
        en: "TTW/TTA - \"Loosely TTA\" known risks are taken in the fertile window. \"OOPS\" pregnancy would be welcome."
        fr: "TTW/TTA — « TTA souple » : des risques connus sont pris pendant la fenêtre fertile. Une grossesse imprévue serait bienvenue."
    - value: 6
      label:
        en: "TTW - Charting only for health/curiosity. Unprotected intercourse happens whenever. Pregnancy very welcome."
        fr: "TTW — Suivi uniquement par intérêt pour la santé ou par curiosité. Rapports non protégés à tout moment. Grossesse très bienvenue."
    - value: 7
      label:
        en: "TTW/TTC - Pregnancy very welcome (moving up the scale in very near future)."
        fr: "TTW/TTC — Grossesse très bienvenue (progression sur l'échelle dans un avenir très proche)."
    - value: 8
      label:
        en: "TTC - \"Excited to start or grow a family.\" Intentional intercourse every cycle, but would not use any fertility treatments if needed."
        fr: "TTC — « Impatient(e) de fonder ou d'agrandir la famille ». Rapports intentionnels à chaque cycle, mais sans recourir à un traitement de fertilité."
    - value: 9
      label:
        en: "TTC - \"Highly hopeful TTC\" Intentional intercourse every cycle. Would consider some but not all fertility treatments if needed."
        fr: "TTC — « Très motivé(e) ». Rapports intentionnels à chaque cycle. Envisagerait certains traitements de fertilité, mais pas tous."
    - value: 10
      label:
        en: "TTC - \"Seriously trying.\" Intentional intercourse every cycle. Would pursue any and all fertility treatments or procedures if needed."
        fr: "TTC — « Sérieusement en essai ». Rapports intentionnels à chaque cycle. Envisagerait tous les traitements ou interventions de fertilité."
  repeatable: P1D
  devNotes: >-
    A recalled time trying lives on fertility-ttc-duration (3.45.0), never as a back-dated event here; an
    intake writes the current intention here, dated the intake (MENSTRUAL-CYCLE.md § Time trying to
    conceive).
fertility-ttc-duration:
  version: v1
  label:
    en: Time trying to conceive
    fr: Durée des essais de conception
  description:
    en: How long you have been trying to conceive, as you recall it.
    fr: Depuis combien de temps vous essayez de concevoir, selon votre souvenir.
  streamId: fertility-ttc-duration
  eventType: fertility/ttc-duration-v1
  type: select
  options:
    - value: less-than-6-months
      label: { en: Less than 6 months, fr: Moins de 6 mois }
    - value: 6-12-months
      label: { en: 6 to 12 months, fr: 6 à 12 mois }
    - value: 1-2-years
      label: { en: 1 to 2 years, fr: 1 à 2 ans }
    - value: more-than-2-years
      label: { en: More than 2 years, fr: Plus de 2 ans }
    - value: on-break
      label: { en: Currently taking a break, fr: En pause actuellement }
  repeatable: any
  references:
    snomed: ["169449001"]
  devNotes: >-
    A recalled summary (site-agents#38), like fertility-cycles-regularity: one event per answer, `time`
    at the date it is given (MENSTRUAL-CYCLE.md § Recalled summaries), never back-dated to a start of
    trying, which a band does not give. Bands, not months: the edges are the guideline anchors (6, 12,
    24 months), and a number would invent precision. `on-break` is a reported status that states no
    duration. The intention stays on fertility-ttc-tta, a sibling stream so a grant on one never covers
    the other: an intake writes the current intention there for the four bands, and nothing there for
    `on-break`. SNOMED 169449001 Trying to conceive (finding). LOINC 64632-3 (PhenX, TRIAL) asks the
    same question as a number of months, so it is not this item's code; no fhir block (a band needs a
    range value, which the fhir checker has no kind for).
fertility-sexual-activity:
  version: v1
  label:
    en: Sexual activity
    fr: Activité sexuelle
  description:
    en: Sexual intercourse, and any protection used.
    fr: Rapport sexuel et protection utilisée, le cas échéant.
  streamId: fertility-sexual-activity
  eventType: reproductive-sexuality/detailed
  type: select
  repeatable: any
  options:
    - value: 'fertile'
      label:
        en: "Unprotected intercourse"
        fr: "Rapport complet non protégé"
    - value: 'incomplete'
      label:
        en: "No ejaculation (incomplete)"
        fr: "Sans éjaculation (incomplet)"
    - value: 'withdrawal'
      label:
        en: "Withdrawal before ejaculation"
        fr: "Retrait avant éjaculation"
    - value: 'condom'
      label:
        en: "Usage of a condom"
        fr: "Utilisation d'un préservatif"
    - value: 'cervical-barrier'
      label:
        en: "Usage of a cervical barrier"
        fr: "Utilisation d'une barrière cervicale"
    - value: 'protected'
      label:
        en: "Protected intercourse (unspecified method)"
        fr: "Rapport protégé (méthode non précisée)"
  # FHIR (plan 133): SNOMED CT 364316005 "Sexual intercourse observable"; one coding per option. The SNOMED CT concepts
  # that once named withdrawal, condom use and incomplete intercourse are inactive, so those answers are codes of the
  # HDS fertility system (documentation/FHIR-MAPPING.md, Fertility charting).
  references:
    snomed: ["364316005"]
  fhir:
    resourceType: Observation
    category: fertility
    code: { system: http://snomed.info/sct, code: "364316005", display: Sexual intercourse observable }
    value:
      kind: coded
      options:
        fertile: { system: http://snomed.info/sct, code: "2314005", display: Unprotected sexual intercourse }
        protected: { system: http://snomed.info/sct, code: "63537005", display: Protected sexual intercourse }
        incomplete: { system: https://hds.ngo/fhir/CodeSystem/fertility, code: intercourse-without-ejaculation, display: Intercourse without ejaculation }
        withdrawal: { system: https://hds.ngo/fhir/CodeSystem/fertility, code: intercourse-withdrawal, display: Intercourse with withdrawal before ejaculation }
        condom: { system: https://hds.ngo/fhir/CodeSystem/fertility, code: intercourse-condom, display: Intercourse with a condom }
        cervical-barrier: { system: https://hds.ngo/fhir/CodeSystem/fertility, code: intercourse-cervical-barrier, display: Intercourse with a cervical barrier }
    profiles: {}
fertility-genital-contact:
  version: v1
  label:
    en: Non-intercourse genital contact
    fr: Contact génital sans rapport sexuel
  description:
    en: Genital contact without intercourse.
    fr: Contact génital sans rapport sexuel.
  streamId: fertility-genital-contact
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: >-
    External contact or manual stimulation involving genital exposure. Relevant to fertility-
    awareness charting because residual sperm exposure can still result in pregnancy. Distinct
    from `fertility-sexual-activity`, which records intercourse variants; both can co-exist on
    the same day.
  # FHIR (plan 133): the HDS item coding, no value.
  fhir:
    resourceType: Observation
    category: fertility
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: fertility-genital-contact, display: Non-intercourse genital contact }
    profiles: {}
fertility-tracking-method:
  version: v1
  label:
    en: Fertility-tracking methods
    fr: Méthodes de suivi de fertilité
  description:
    en: The charting methods or devices you use.
    fr: Les méthodes ou appareils de suivi que vous utilisez.
  streamId: fertility-tracking-method
  eventType: fertility/tracking-method-v1
  type: multi-select
  options:
    - value: billings
      label: { en: Billings, fr: Billings }
    - value: creighton
      label: { en: Creighton Model, fr: Modèle Creighton }
    - value: sympto-thermal
      label: { en: Sympto-Thermal Method, fr: Méthode sympto-thermique }
    - value: marquette
      label: { en: Marquette Method, fr: Méthode Marquette }
    - value: femm
      label: { en: FEMM, fr: FEMM }
    - value: justisse
      label: { en: Justisse Method, fr: Méthode Justisse }
    - value: peak-day
      label: { en: Peak Day tracking, fr: Suivi du jour sommet }
    - value: clearblue
      label: { en: Clearblue monitor, fr: Moniteur Clearblue }
    - value: mira
      label: { en: Mira, fr: Mira }
    - value: inito
      label: { en: Inito, fr: Inito }
    - value: oura
      label: { en: Oura Ring, fr: Bague Oura }
    - value: kegg
      label: { en: Kegg, fr: Kegg }
    - value: other
      label: { en: Other, fr: Autre }
  # NOT `once`: the method set changes over time AND it is the interpretive key for
  # dated cycle observations — under `once` a chart recorded under one method would be
  # re-read under whatever is current today. Same reasoning as
  # profile-reproductive-stage. Each event is a complete dated snapshot of the set.
  repeatable: any
  devNotes: >-
    They determine how the person's cycle observations should be read. Each event is a complete
    dated snapshot of the methods active at that time, so a method that stops simply does not
    appear in the next snapshot.
fertility-pregnancy:
  version: v2
  label:
    en: Pregnancy
    fr: Grossesse
  description:
    en: A pregnancy and its outcome.
    fr: Une grossesse et son issue.
  duration:
    mandatory: true
    canBeNull: true
    maxSeconds: 32400000 # maximum known pregnancy 53 weeks
  streamId: fertility-pregnancies
  eventType: pregnancy/detailed
  devNotes: |-
    One per fetus (can be multiple events sharing the same `time` for multifetal pregnancies).
    The value of `event.time` is the patient's LMP (last menstrual period) date for this
    pregnancy — standard OB/GYN dating convention. Derivations:
      - estimated conception ≈ time + 14 days
      - estimated delivery   ≈ time + 280 days (40 weeks)
      - outcome date          = time + duration
    When content value is 'ongoing', `event.duration` must be `null`.
    For any other value, `event.duration` is the elapsed time from LMP to outcome.
    Use 'very-early-loss' for losses with `duration < 6 weeks` (biochemical / pre-clinical
    pregnancies, typically detected only by hCG without ultrasound confirmation —
    clinically distinct from miscarriage per ESHRE 2022 RPL guideline).
    Use 'miscarriage' for clinically-confirmed losses ≥ 6 weeks.
    When the outcome is 'livebirth' or 'stillbirth', one
    `fertility-delivery` event exists per baby, timed at the delivery date.
  type: select
  repeatable: any
  options:
    - value: 'ongoing'
      label:
        en: "Ongoing pregnancy"
        fr: "Grossesse en cours"
    - value: 'very-early-loss'
      label:
        en: "Very early loss (biochemical pregnancy, <6w)"
        fr: "Perte très précoce (grossesse biochimique, < 6 sem.)"
    - value: 'miscarriage'
      label:
        en: "Miscarriage"
        fr: "Fausse couche"
    - value: 'ectopic'
      label:
        en: "Ectopic"
        fr: "Grossesse extra-utérine"
    - value: 'molar'
      label:
        en: "Molar (hydatidiform mole)"
        fr: "Grossesse molaire (môle hydatiforme)"
    - value: 'stillbirth'
      label:
        en: "Stillbirth"
        fr: "Mortinaissance"
    - value: 'livebirth'
      label:
        en: "Live birth"
        fr: "Naissance vivante"
    - value: 'abortion'
      label:
        en: "Induced abortion (termination)"
        fr: "Interruption de grossesse"
fertility-delivery:
  version: v1
  label:
    en: Delivery
    fr: Accouchement
  description:
    en: A baby's birth, recorded once per baby.
    fr: La naissance d'un bébé, enregistrée une fois par bébé.
  streamId: fertility-deliveries
  eventType: delivery/composite-v1
  type: composite
  repeatable: any
  composite:
    mode:
      label:
        en: Mode of delivery
        fr: Mode d'accouchement
      type: select
      options:
        - value: 'vaginal-spontaneous'
          label: { en: 'Vaginal — spontaneous', fr: 'Vaginal — spontané' }
        - value: 'vaginal-forceps'
          label: { en: 'Vaginal — forceps-assisted', fr: 'Vaginal — assisté par forceps' }
        - value: 'vaginal-vacuum'
          label: { en: 'Vaginal — vacuum-assisted', fr: 'Vaginal — assisté par ventouse' }
        - value: 'cesarean'
          label: { en: 'Cesarean', fr: 'Césarienne' }
        - value: 'unknown'
          label: { en: 'Unknown', fr: 'Inconnu' }
    birthWeight:
      label:
        en: Birth weight (g)
        fr: Poids de naissance (g)
      type: number
      canBeNull: true
    sex:
      label:
        en: Sex assigned at birth
        fr: Sexe à la naissance
      type: select
      canBeNull: true
      options:
        - value: 'male'
          label: { en: 'Male', fr: 'Masculin' }
        - value: 'female'
          label: { en: 'Female', fr: 'Féminin' }
        - value: 'indeterminate'
          label: { en: 'Indeterminate', fr: 'Indéterminé' }
        - value: 'unknown'
          label: { en: 'Unknown', fr: 'Inconnu' }
    apgar5min:
      label:
        en: APGAR score at 5 minutes (0–10)
        fr: Score APGAR à 5 minutes (0–10)
      type: number
      canBeNull: true
    nicuLengthOfStayDays:
      label:
        en: NICU length of stay (days)
        fr: Durée de séjour en USIN (jours)
      type: number
      canBeNull: true
    neonatalDeathDays:
      label:
        en: Days from birth to neonatal death (leave empty if alive)
        fr: Jours entre naissance et décès néonatal (laisser vide si en vie)
      type: number
      canBeNull: true
  devNotes: >-
    One event per baby, in the woman's account. Siblings of a multifetal pregnancy share
    `event.time` (the delivery date) and usually share `mode`, while per-baby attributes vary:
    birth weight, sex, APGAR, NICU stay, neonatal death. Used together with
    `fertility-pregnancy`, whose `event.time` is the LMP. A delivery event exists only when the
    corresponding `fertility-pregnancy.outcome` is 'livebirth' or 'stillbirth'. Field
    vocabularies align to LOINC 73762-7 (mode), 8339-4 (birth weight), 76689-9 (sex assigned at
    birth) and 9274-2 (5-minute APGAR).
# Urine hormones. Renamed from fertility-hormone-* to body-urine-hormones-* (key == streamId)
# so the specimen is explicit: serum and urine assays of the same hormone are different
# observations with different reference ranges, and the neutral key used to hide that.
# Serum twins live in body.yaml under body-blood-serum-*.
body-urine-hormones-fsh:
  version: v2
