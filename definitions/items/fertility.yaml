  type: select
  repeatable: any
  options:
    - value: 'fertile'
      label:
        en: "Unprotected intercourse"
        fr: "Rapport complet non protégé"
    - value: 'incomplete'
      label:
        en: "No ejaculation (incomplete)"
        fr: "Sans éjaculation (incomplet)"
    - value: 'withdrawal'
      label:
        en: "Withdrawal before ejaculation"
        fr: "Retrait avant éjaculation"
    - value: 'condom'
      label:
        en: "Usage of a condom"
        fr: "Utilisation d'un préservatif"
    - value: 'cervical-barrier'
      label:
        en: "Usage of a cervical barrier"
        fr: "Utilisation d'une barrière cervicale"
    - value: 'protected'
      label:
        en: "Protected intercourse (unspecified method)"
        fr: "Rapport protégé (méthode non précisée)"
fertility-genital-contact:
  version: v1
  label:
    en: Non-intercourse genital contact
    fr: Contact génital sans rapport sexuel
  description:
    en: Genital contact without intercourse.
    fr: Contact génital sans rapport sexuel.
  streamId: fertility-genital-contact
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: >-
    External contact or manual stimulation involving genital exposure. Relevant to fertility-
    awareness charting because residual sperm exposure can still result in pregnancy. Distinct
    from `fertility-sexual-activity`, which records intercourse variants; both can co-exist on
    the same day.
fertility-tracking-method:
  version: v1
  label:
    en: Fertility-tracking methods
    fr: Méthodes de suivi de fertilité
  description:
    en: The charting methods or devices you use.
    fr: Les méthodes ou appareils de suivi que vous utilisez.
  streamId: fertility-tracking-method
  eventType: fertility/tracking-method-v1
  type: multi-select
  options:
    - value: billings
      label: { en: Billings Ovulation Method, fr: Méthode Billings }
    - value: creighton
      label: { en: Creighton Model, fr: Modèle Creighton }
    - value: sympto-thermal
      label: { en: Sympto-Thermal Method, fr: Méthode sympto-thermique }
    - value: marquette
      label: { en: Marquette Method, fr: Méthode Marquette }
    - value: femm
      label: { en: FEMM, fr: FEMM }
    - value: justisse
      label: { en: Justisse Method, fr: Méthode Justisse }
    - value: peak-day
      label: { en: Peak Day tracking, fr: Suivi du jour sommet }
    - value: clearblue
      label: { en: Clearblue monitor, fr: Moniteur Clearblue }
    - value: mira
      label: { en: Mira, fr: Mira }
    - value: inito
      label: { en: Inito, fr: Inito }
    - value: oura
      label: { en: Oura Ring, fr: Bague Oura }
    - value: kegg
      label: { en: Kegg, fr: Kegg }
    - value: other
      label: { en: Other, fr: Autre }
  # NOT `once`: the method set changes over time AND it is the interpretive key for
  # dated cycle observations — under `once` a chart recorded under one method would be
  # re-read under whatever is current today. Same reasoning as
  # profile-reproductive-stage. Each event is a complete dated snapshot of the set.
  repeatable: any
  devNotes: >-
    They determine how the person's cycle observations should be read. Each event is a complete
    dated snapshot of the methods active at that time, so a method that stops simply does not
    appear in the next snapshot.
fertility-pregnancy:
  version: v2
  label:
    en: Pregnancy
    fr: Grossesse
  description:
    en: A pregnancy and its outcome.
    fr: Une grossesse et son issue.
  duration:
    mandatory: true
    canBeNull: true
    maxSeconds: 32400000 # maximum known pregnancy 53 weeks
  streamId: fertility-pregnancies
  eventType: pregnancy/detailed
  devNotes: |-
    One per fetus (can be multiple events sharing the same `time` for multifetal pregnancies).
    The value of `event.time` is the patient's LMP (last menstrual period) date for this
    pregnancy — standard OB/GYN dating convention. Derivations:
      - estimated conception ≈ time + 14 days
      - estimated delivery   ≈ time + 280 days (40 weeks)
      - outcome date          = time + duration
    When content value is 'ongoing', `event.duration` must be `null`.
    For any other value, `event.duration` is the elapsed time from LMP to outcome.
    Use 'very-early-loss' for losses with `duration < 6 weeks` (biochemical / pre-clinical
    pregnancies, typically detected only by hCG without ultrasound confirmation —
    clinically distinct from miscarriage per ESHRE 2022 RPL guideline).
    Use 'miscarriage' for clinically-confirmed losses ≥ 6 weeks.
    When the outcome is 'livebirth' or 'stillbirth', one
    `fertility-delivery` event exists per baby, timed at the delivery date.
  type: select
  repeatable: any
  options:
    - value: 'ongoing'
      label:
        en: "Ongoing pregnancy"
        fr: "Grossesse en cours"
    - value: 'very-early-loss'
      label:
        en: "Very early loss (biochemical pregnancy, <6w)"
        fr: "Perte très précoce (grossesse biochimique, < 6 sem.)"
    - value: 'miscarriage'
      label:
        en: "Miscarriage"
        fr: "Fausse couche"
    - value: 'ectopic'
      label:
        en: "Ectopic"
        fr: "Grossesse extra-utérine"
    - value: 'molar'
      label:
        en: "Molar (hydatidiform mole)"
        fr: "Grossesse molaire (môle hydatiforme)"
    - value: 'stillbirth'
      label:
        en: "Stillbirth"
        fr: "Mortinaissance"
    - value: 'livebirth'
      label:
        en: "Live birth"
        fr: "Naissance vivante"
    - value: 'abortion'
      label:
        en: "Abortion"
        fr: "Interruption de grossesse"
fertility-delivery:
  version: v1
  label:
    en: Delivery
    fr: Accouchement
  description:
    en: A baby's birth, recorded once per baby.
    fr: La naissance d'un bébé, enregistrée une fois par bébé.
  streamId: fertility-deliveries
  eventType: delivery/composite-v1
  type: composite
  repeatable: any
  composite:
    mode:
      label:
        en: Mode of delivery
        fr: Mode d'accouchement
      type: select
      options:
        - value: 'vaginal-spontaneous'
          label: { en: 'Vaginal — spontaneous', fr: 'Vaginal — spontané' }
        - value: 'vaginal-forceps'
          label: { en: 'Vaginal — forceps-assisted', fr: 'Vaginal — assisté par forceps' }
        - value: 'vaginal-vacuum'
          label: { en: 'Vaginal — vacuum-assisted', fr: 'Vaginal — assisté par ventouse' }
        - value: 'cesarean'
          label: { en: 'Cesarean', fr: 'Césarienne' }
        - value: 'unknown'
          label: { en: 'Unknown', fr: 'Inconnu' }
    birthWeight:
      label:
        en: Birth weight (g)
        fr: Poids de naissance (g)
      type: number
      canBeNull: true
    sex:
      label:
        en: Sex assigned at birth
        fr: Sexe à la naissance
      type: select
      canBeNull: true
      options:
        - value: 'male'
          label: { en: 'Male', fr: 'Masculin' }
        - value: 'female'
          label: { en: 'Female', fr: 'Féminin' }
        - value: 'indeterminate'
          label: { en: 'Indeterminate', fr: 'Indéterminé' }
        - value: 'unknown'
          label: { en: 'Unknown', fr: 'Inconnu' }
    apgar5min:
      label:
        en: APGAR score at 5 minutes (0–10)
        fr: Score APGAR à 5 minutes (0–10)
      type: number
      canBeNull: true
    nicuLengthOfStayDays:
      label:
        en: NICU length of stay (days)
        fr: Durée de séjour en USIN (jours)
      type: number
      canBeNull: true
    neonatalDeathDays:
      label:
        en: Days from birth to neonatal death (leave empty if alive)
        fr: Jours entre naissance et décès néonatal (laisser vide si en vie)
      type: number
      canBeNull: true
  devNotes: >-
    One event per baby, in the woman's account. Siblings of a multifetal pregnancy share
    `event.time` (the delivery date) and usually share `mode`, while per-baby attributes vary:
    birth weight, sex, APGAR, NICU stay, neonatal death. Used together with
    `fertility-pregnancy`, whose `event.time` is the LMP. A delivery event exists only when the
    corresponding `fertility-pregnancy.outcome` is 'livebirth' or 'stillbirth'. Field
    vocabularies align to LOINC 73762-7 (mode), 8339-4 (birth weight), 76689-9 (sex assigned at
    birth) and 9274-2 (5-minute APGAR).
# Urine hormones. Renamed from fertility-hormone-* to body-urine-hormones-* (key == streamId)
# so the specimen is explicit: serum and urine assays of the same hormone are different
# observations with different reference ranges, and the neutral key used to hide that.
# Serum twins live in body.yaml under body-blood-serum-*.
body-urine-hormones-fsh:
  version: v2
  label:
    en: FSH (urine)
    fr: FSH (urine)
  description:
    en: Follicle-stimulating hormone in your urine.
    fr: Hormone folliculo-stimulante dans vos urines.
  streamId: body-urine-hormones-fsh
  eventType: concentration/iu-l
  type: number
  repeatable: any
  reminder:
    relativeTo: fertility-cycles-start
    relativeDays: [2, 3, 4]
  references:
    snomed: ["167382006"]
body-urine-hormones-hcg:
  version: v2
  label:
    en: hCG (urine)
    fr: hCG (urine)
  description:
    en: Pregnancy hormone in your urine.
    fr: Hormone de grossesse dans vos urines.
  streamId: body-urine-hormones-hcg
  eventType: concentration/iu-l
  type: number
  repeatable: any
  # 67900009 is the unqualified hCG measurement — SNOMED has no quantitative urine-specific
  # concept (167391005 is a 24-hour assay, a different procedure).
  references:
    snomed: ["67900009"]
body-urine-hormones-pdg:
  version: v2
  label:
    en: PdG (urine)
    fr: PdG (urine)
  description:
    en: A progesterone by-product in your urine, showing ovulation has happened.
    fr: Un dérivé de la progestérone dans vos urines, indiquant que l'ovulation a eu lieu.
  streamId: body-urine-hormones-pdg
  eventType: concentration/iu-l
  type: number
  repeatable: any
  # No SNOMED reference: pregnanediol-3-glucuronide has no concept. 89113004 is
  # "Pregnanediol measurement" — a different substance, so it is not used here.
body-urine-hormones-e3g:
  version: v2
  label:
    en: E3G (urine)
    fr: E3G (urine)
  description:
    en: An estrogen by-product in your urine, rising as you approach ovulation.
    fr: Un dérivé de l'œstrogène dans vos urines, augmentant à l'approche de l'ovulation.
  streamId: body-urine-hormones-e3g
  eventType: concentration/ug-l
  type: number
  repeatable: any
  # No SNOMED reference: estrone-3-glucuronide measurement has no concept.
body-urine-hormones-lh:
  version: v2
  label:
    en: LH (urine)
    fr: LH (urine)
  description:
    en: Luteinizing hormone in your urine, which surges just before ovulation.
    fr: Hormone lutéinisante dans vos urines, qui culmine juste avant l'ovulation.
  streamId: body-urine-hormones-lh
  eventType: concentration/iu-l
  type: number
  repeatable: any
  reminder:
    relativeTo: fertility-cycles-start
    relativeDays: [2, 3, 4]
  references:
    snomed: ["167381004"]
# The FSH/hCG/PdG/E3G rename aliases (fertility-hormone-{fsh,hcg,pdg,e3g}) were removed
# in Plan 83 Phase 6 once bridge-mira and doctor-dashboard migrated to the
# body-urine-hormones-* keys — the rename kept the same streamId, so no data moved and
# nothing orphaned. `fertility-hormone-lh` below is NOT one of those aliases: it is the
# permanent home of historical LH events written on concentration/mg-l (before the unit
# was corrected to iu-l). forEvent resolves those legacy events to it, so it must stay.
fertility-hormone-lh:
  version: v1
  deprecated: true
  label:
    en: LH (urine, legacy)
    fr: LH (urine, ancien)
  description:
    en: Deprecated — use body-urine-hormones-lh. This item was typed mg/L in error; LH is reported in IU/L.
    fr: Obsolète — utilisez body-urine-hormones-lh. Cet item était typé mg/L par erreur ; la LH se mesure en IU/L.
  streamId: body-urine-hormones-lh
  eventType: concentration/mg-l
  type: number
  repeatable: any
  # Kept so existing events (stored with type concentration/mg-l) still resolve and render.
  # The stored numbers are already correct as IU/L — bridge-mira writes Mira's value verbatim
  # and Mira reports LH in mIU/mL, which is numerically identical to IU/L. Only the type label
  # was wrong. The item cannot be retyped in place: stored events carry the old type, and the
  # data lives in users' own accounts, so there is nothing for HDS to migrate.
  # This is the only urine hormone that could be deprecated rather than renamed — the loader
  # rejects two items sharing a streamId:eventType pair, and the others keep their eventType.
  devNotes: "B-2026-07-15-1. Do not use for new data."
fertility-test-opk:
  version: v1
  label:
    en: Ovulation test (OPK)
    fr: Test d'ovulation (OPK)
  description:
    en: Ovulation predictor kit result.
    fr: Résultat d'un test d'ovulation.
  streamId: fertility-test-opk
  eventType: test-result/scale
  type: number
  repeatable: any
  devNotes: >-
    Stored on `test-result/scale`: -1 negative, 0 indeterminate, 1 positive. Intermediate values
    carry semi-quantitative results, e.g. 0.5 for a weak positive.
fertility-test-pregnancy:
  version: v1
  label:
    en: Pregnancy test
    fr: Test de grossesse
  description:
    en: Home pregnancy test result.
    fr: Résultat d'un test de grossesse à domicile.
  streamId: fertility-test-pregnancy
  eventType: test-result/scale
  type: number
  repeatable: any
  devNotes: >-
    Stored on `test-result/scale`: -1 negative, 0 indeterminate, 1 positive.

