    loinc: ["25639-6"]
  fhir:
    resourceType: Observation
    category: laboratory
    code: { system: http://loinc.org, code: 25639-6, display: "Follitropin [Units/volume] in Urine by 2nd IRP" }
    value:
      kind: quantity
      units:
        concentration/iu-l: "[IU]/L"
    profiles:
