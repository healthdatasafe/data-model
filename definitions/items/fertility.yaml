# The FSH/hCG/PdG/E3G rename aliases (fertility-hormone-{fsh,hcg,pdg,e3g}) were removed
# in Plan 83 Phase 6 once bridge-mira and doctor-dashboard migrated to the
# body-urine-hormones-* keys — the rename kept the same streamId, so no data moved and
# nothing orphaned. `fertility-hormone-lh` below is NOT one of those aliases: it is the
# permanent home of historical LH events written on concentration/mg-l (before the unit
# was corrected to iu-l). forEvent resolves those legacy events to it, so it must stay.
# `fertility-hormone-pdg` came back in 4.0.0 with the same role for the PdG events written
# on concentration/iu-l (before the unit was corrected to mg-l, shown μg/mL): same streamId and
# eventType as the alias removed in 2.3.0, so it resolves exactly the events that alias once did.
fertility-hormone-lh:
  version: v1
  deprecated: true
  label:
    en: LH (urine, legacy)
    fr: LH (urine, ancien)
  description:
    en: Deprecated — use body-urine-hormones-lh. This item was typed mg/L in error; LH is reported in IU/L.
    fr: Obsolète — utilisez body-urine-hormones-lh. Cet item était typé mg/L par erreur ; la LH se mesure en IU/L.
  streamId: body-urine-hormones-lh
  eventType: concentration/mg-l
  type: number
  repeatable: any
  # Kept so existing events (stored with type concentration/mg-l) still resolve and render.
  # The stored numbers are already correct as IU/L — bridge-mira writes Mira's value verbatim
  # and Mira reports LH in mIU/mL, which is numerically identical to IU/L. Only the type label
  # was wrong. The item cannot be retyped in place: stored events carry the old type, and the
  # data lives in users' own accounts, so there is nothing for HDS to migrate.
  # This is the only urine hormone that could be deprecated rather than renamed — the loader
  # rejects two items sharing a streamId:eventType pair, and the others keep their eventType.
  # The fhir block is body-urine-hormones-lh's: the numbers are IU/L, so the stored eventType
  # concentration/mg-l renders as [IU]/L. A deprecated item is never an import key, so the two
  # blocks on 15079-7 never clash (FHIR-MAPPING.md § Import).
  devNotes: "B-2026-07-15-1. Do not use for new data."
  fhir:
    resourceType: Observation
    category: laboratory
    code: { system: http://loinc.org, code: 15079-7, display: "Lutropin [Units/volume] in Urine" }
    value:
      kind: quantity
      units:
        concentration/mg-l: "[IU]/L"
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-laboratory-pathology-uv-ips
fertility-hormone-pdg:
  version: v1
  deprecated: true
  label:
    en: PdG (urine, legacy)
    fr: PdG (urine, ancien)
  description:
    en: "Deprecated: use body-urine-hormones-pdg. This item was typed IU/L in error; PdG is reported in μg/mL."
    fr: "Obsolète : utilisez body-urine-hormones-pdg. Cet item était typé IU/L par erreur ; le PdG se mesure en μg/mL."
  streamId: body-urine-hormones-pdg
  eventType: concentration/iu-l
  type: number
  repeatable: any
  # Kept so existing events (stored with type concentration/iu-l) still resolve and render.
  # The stored numbers are μg/mL: bridge-mira writes Mira's value verbatim and Mira reports PdG
  # in μg/mL (1 to 22); PdG has no international unit, so only the type label was wrong. Same
  # situation as fertility-hormone-lh (B-2026-07-15-1): the item cannot be retyped in place,
  # stored events carry the old type and the data lives in users' own accounts. The key is the
  # Plan 83 rename alias removed in 2.3.0, back with the same streamId:eventType pair, now as the
  # legacy home of those events rather than an alias of the active item.
  # The fhir block is body-urine-hormones-pdg's: the numbers are μg/mL, so the stored eventType
  # concentration/iu-l renders as ug/mL.
  devNotes: "Retyped in data-model 4.0.0, see CHANGELOG. Do not use for new data."
  fhir:
    resourceType: Observation
    category: laboratory
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: body-urine-hormones-pdg, display: "PdG (urine)" }
    value:
      kind: quantity
      units:
        concentration/iu-l: ug/mL
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-laboratory-pathology-uv-ips
fertility-test-opk:
  version: v1
  label:
    en: Ovulation test (OPK)
    fr: Test d'ovulation (OPK)
  description:
    en: Ovulation predictor kit result.
    fr: Résultat d'un test d'ovulation.
  streamId: fertility-test-opk
  eventType: test-result/scale
  type: select
  options:
    - value: -1
      label: { en: Negative, fr: Négatif }
    - value: 0
      label: { en: Indeterminate, fr: Indéterminé }
    - value: 0.5
      label: { en: High (approaching peak), fr: Élevé (approche du pic) }
    - value: 1
      label: { en: Positive, fr: Positif }
  repeatable: any
  devNotes: >-
    Stored on `test-result/scale`: -1 negative, 0 indeterminate, 0.5 high (approaching the LH
    peak: a "high fertility" reading, HealthKit `estrogenSurge`), 1 positive. The eventType still
    admits other intermediate values, but the FHIR rendering (plan 133) maps the four options only:
    an event with another value is refused on render, listed, never shown. Was a bare `type:
    number` until 3.12.0, which left nothing user-facing saying what to enter once the scale was
    moved out of the description. (B-2026-09-23-3.) Option 0.5 added in plan 133 (fertility F2).
  # FHIR (plan 133): a urine immunoassay, so Observation|laboratory beside the urine LH quantity. No LOINC exists for a
  # qualitative urine LH test, so the code is the HDS item coding (the E3G and PdG precedent); 0.5 is a code of the HDS
  # fertility system. Offered unticked in a SMART consent (stream consentOptIn).
  fhir:
    resourceType: Observation
    category: laboratory
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: fertility-test-opk, display: Ovulation test (OPK) }
    value:
      kind: coded
      options:
        "-1": { system: http://snomed.info/sct, code: "260385009", display: Negative }
        "0": { system: http://snomed.info/sct, code: "82334004", display: Indeterminate }
        "0.5": { system: https://hds.ngo/fhir/CodeSystem/fertility, code: ovulation-test-high, display: High (approaching peak) }
        "1": { system: http://snomed.info/sct, code: "10828004", display: Positive }
      alsoMatch:
        "-1": [{ system: http://snomed.info/sct, code: "260415000", display: Not detected }]
        "0": [{ system: http://snomed.info/sct, code: "42425007", display: Equivocal }]
        "1": [{ system: http://snomed.info/sct, code: "260373001", display: Detected }]
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-laboratory-pathology-uv-ips
fertility-test-pregnancy:
  version: v1
  label:
    en: Pregnancy test
    fr: Test de grossesse
  description:
    en: Home pregnancy test result.
    fr: Résultat d'un test de grossesse à domicile.
  streamId: fertility-test-pregnancy
  eventType: test-result/scale
  type: select
  options:
    - value: -1
      label: { en: Negative, fr: Négatif }
    - value: 0
      label: { en: Indeterminate, fr: Indéterminé }
    - value: 1
      label: { en: Positive, fr: Positif }
  repeatable: any
  devNotes: >-
    Stored on `test-result/scale`: -1 negative, 0 indeterminate, 1 positive. A home pregnancy test
    is read qualitatively, so unlike the OPK there is no meaningful intermediate value to offer.
    Was a bare `type: number` until 3.12.0. (B-2026-09-23-3.)
  # FHIR (plan 133): the method-neutral 2106-3, the rapid immunoassay 80384-1 import only. Observation|laboratory,
  # offered unticked in a SMART consent (stream consentOptIn). An intermediate value is refused on render.
  references:
    loinc: ["2106-3"]
