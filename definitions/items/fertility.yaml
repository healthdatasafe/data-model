fertility-miscarriages-count:
  version: temporary
  deprecated: true
  label: Nb of miscarriages
  description: |-
    DEPRECATED — record each miscarriage as its own `fertility-pregnancy`
    event with `content = miscarriage`, `time = LMP for that pregnancy`, and
    `duration = LMP→outcome`. Aggregate counts are derived analyst-side from
    the count of such events. The legacy aggregate-count item (this one) is
    retained for backwards compatibility with pre-existing clients only.
  streamId: fertility-miscarriages
  eventType: count/generic
  type: number
  repeatable: once
fertility-ttc-tta:
  version: v1
  label:
    en: Trying to conceive / Avoiding pregnancy
    fr: Essai de conception / Évitement de grossesse
  description:
    en: Your current intention about becoming pregnant.
    fr: Votre intention actuelle concernant une grossesse.
  streamId: fertility-ttc-tta
  eventType: ratio/generic
  type: select
  options:
    - value: 0
      label:
        en: "TTA - Not taking risks. Would take all available measures to end a pregnancy."
        fr: "TTA — Aucun risque pris. Prendrait toutes les mesures disponibles pour interrompre une grossesse."
    - value: 1
      label:
        en: "TTA - Not taking risks. Would strongly consider placing baby for adoption."
        fr: "TTA — Aucun risque pris. Envisagerait fortement de confier le bébé à l'adoption."
    - value: 2
      label:
        en: "TTA - Not taking risks. Would need some time, maybe counseling. Ultimately keeping the pregnancy."
        fr: "TTA — Aucun risque pris. Aurait besoin de temps, peut-être d'un accompagnement, mais mènerait finalement la grossesse à terme."
    - value: 4
      label:
        en: "TTA - Not taking risks. Currently content with family size but a surprise pregnancy would be welcome."
        fr: "TTA — Aucun risque pris. Satisfait(e) de la taille actuelle de la famille, mais une grossesse surprise serait bienvenue."
    - value: 5
      label:
        en: "TTW/TTA - \"Loosely TTA\" known risks are taken in the fertile window. \"OOPS\" pregnancy would be welcome."
        fr: "TTW/TTA — « TTA souple » : des risques connus sont pris pendant la fenêtre fertile. Une grossesse imprévue serait bienvenue."
    - value: 6
      label:
        en: "TTW - Charting only for health/curiosity. Unprotected intercourse happens whenever. Pregnancy very welcome."
        fr: "TTW — Suivi uniquement par intérêt pour la santé ou par curiosité. Rapports non protégés à tout moment. Grossesse très bienvenue."
    - value: 7
      label:
        en: "TTW/TTC - Pregnancy very welcome (moving up the scale in very near future)."
        fr: "TTW/TTC — Grossesse très bienvenue (progression sur l'échelle dans un avenir très proche)."
    - value: 8
      label:
        en: "TTC - \"Excited to start or grow a family.\" Intentional intercourse every cycle, but would not use any fertility treatments if needed."
        fr: "TTC — « Impatient(e) de fonder ou d'agrandir la famille ». Rapports intentionnels à chaque cycle, mais sans recourir à un traitement de fertilité."
    - value: 9
      label:
        en: "TTC - \"Highly hopeful TTC\" Intentional intercourse every cycle. Would consider some but not all fertility treatments if needed."
        fr: "TTC — « Très motivé(e) ». Rapports intentionnels à chaque cycle. Envisagerait certains traitements de fertilité, mais pas tous."
    - value: 10
      label:
        en: "TTC - \"Seriously trying.\" Intentional intercourse every cycle. Would pursue any and all fertility treatments or procedures if needed."
        fr: "TTC — « Sérieusement en essai ». Rapports intentionnels à chaque cycle. Envisagerait tous les traitements ou interventions de fertilité."
  repeatable: P1D
fertility-sexual-activity:
