  references:
    snomed: ["67900009"]
    loinc: ["25372-4"]
  fhir:
    resourceType: Observation
    category: laboratory
    code: { system: http://loinc.org, code: 25372-4, display: "Choriogonadotropin [Units/volume] in Urine" }
    value:
      kind: quantity
      units:
        concentration/iu-l: "[IU]/L"
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-laboratory-pathology-uv-ips
body-urine-hormones-pdg:
  version: v3
  label:
    en: PdG (urine)
    fr: PdG (urine)
  description:
    en: A progesterone by-product in your urine, showing ovulation has happened.
    fr: Un dérivé de la progestérone dans vos urines, indiquant que l'ovulation a eu lieu.
  streamId: body-urine-hormones-pdg
  eventType: concentration/mg-l
  type: number
  repeatable: any
  # PdG is printed in μg/mL by every home analyser (Mira, Inito, Proov); 1 μg/mL = 1 mg/L, so the
  # number stores as printed on the legacy concentration/mg-l (AGENTS.md no-equivalent-types rule)
  # and the suffix shows the reporting unit, as ferritin shows ng/mL on concentration/ug-l.
  number:
    display:
      suffix: { en: μg/mL, fr: μg/mL }
  # No SNOMED reference: pregnanediol-3-glucuronide has no concept. 89113004 is
  # "Pregnanediol measurement" — a different substance, so it is not used here.
  # No LOINC either (2833-2 "Pregnanediol [Mass/volume] in Urine" is the aglycone, another
  # substance), so the fhir block's code is the HDS item coding (FHIR-MAPPING.md § code).
  # v3, data-model 4.0.0: typed concentration/iu-l until then, although PdG has no international
  # unit. Events written before 4.0.0 carry iu-l and resolve to the deprecated
  # fertility-hormone-pdg below.
  fhir:
    resourceType: Observation
    category: laboratory
    code: { system: https://hds.ngo/fhir/CodeSystem/item, code: body-urine-hormones-pdg, display: "PdG (urine)" }
    value:
      kind: quantity
      units:
        concentration/mg-l: ug/mL
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Observation-results-laboratory-pathology-uv-ips
body-urine-hormones-e3g:
  version: v2
  label:
    en: E3G (urine)
    fr: E3G (urine)
  description:
    en: An estrogen by-product in your urine, rising as you approach ovulation.
    fr: Un dérivé de l'œstrogène dans vos urines, augmentant à l'approche de l'ovulation.
  streamId: body-urine-hormones-e3g
  eventType: concentration/ug-l
  type: number
