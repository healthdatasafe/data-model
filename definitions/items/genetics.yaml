# ── Genetic test results (genetic-variant/coded-v1) ──────────────────────────
# Written by importers, never entered in a form (type: imported). The gene and the variant are coded per event,
# so the item carries no references. Lives under the `genetics` root, which only an explicit grant covers.
# See documentation/GENETICS.md.

genetics-variant:
  version: v1
  type: imported
  label:
    en: Tested gene variant
    fr: Variant génétique testé
    es: Variante genética analizada
  description:
    en: The result of a genetic test for one gene variant, as the laboratory reported it.
    fr: Le résultat d'un test génétique pour un variant d'un gène, tel que le laboratoire l'a rapporté.
    es: El resultado de una prueba genética para una variante de un gen, tal como lo informó el laboratorio.
  streamId: genetics-variant
  eventType: genetic-variant/coded-v1
  repeatable: unlimited
  devNotes: |-
    Written by importers from a genetic test report, never entered in a form. One event per tested variant;
    event `time` = the sample collection date, no duration.
    A panel of several variants is several events. Writes wait for the consumers to honour the root's
    `explicitGrantOnly` marker (documentation/GENETICS.md § Before the first write).
