# Symptom items — additional domains (Plan 77 / data-model#19 §2).
# See documentation/SYMPTOMS.md for cross-system compatibility research.
#
# Model: each concept has BOTH a presence item (eventType activity/plain) and a
# severity item (eventType ratio/proportion, 5-level) on the same streamId — the
# same pattern as Plan-77 §1, and since 2026-09-15 carrying the same flag.
#
# These 28 presence twins shipped un-deprecated in 1.12.0 while §1's identical
# twins were deprecated, so the model said two different things about one pattern.
# They are now `deprecated: true` as well, which here means "hidden from pickers",
# NOT "do not write": presence-only sources keep writing them. Nothing referenced
# these keys when the flag was added, so no writer or reader was affected.
# 5-level hooks 0.0/0.25/0.5/0.75/1.0 (semantic anchors; see DESIGN-NOTES.md).

## Respiratory
symptom-respiratory-cough:
  version: v1
  label:
    en: Cough
    fr: Toux
  description:
    en: "Coughing. Presence marker for sources that record occurrence only (no grade); use symptom-respiratory-cough-severity when a severity is known."
    fr: "Toux. Marqueur de présence pour les sources qui n'enregistrent que l'occurrence (sans échelle) ; utiliser symptom-respiratory-cough-severity lorsqu'une sévérité est connue."
  deprecated: true
  streamId: symptom-respiratory-cough
  eventType: activity/plain
  type: checkbox
  repeatable: unlimited

symptom-respiratory-cough-severity:
  version: v1
  label:
    en: Cough
    fr: Toux
  description:
    en: Coughing.
    fr: Toux.
  streamId: symptom-respiratory-cough
  eventType: ratio/proportion
  type: select
  options: &sev5
    - value: 0.0
      label:
        en: None
        fr: Aucun
    - value: 0.25
      label:
        en: Slight
        fr: Léger
    - value: 0.5
      label:
        en: Moderate
        fr: Modéré
    - value: 0.75
      label:
        en: Severe
        fr: Sévère
    - value: 1.0
      label:
        en: Extreme
        fr: Extrême
  repeatable: unlimited
  references:
    snomed: ["49727002"]

