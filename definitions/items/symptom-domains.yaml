# Symptom items — additional domains (Plan 77 / data-model#19 §2).
# See documentation/SYMPTOMS.md for cross-system compatibility research.
#
# Model: each concept has BOTH a presence item (eventType activity/plain) and a
# severity item (eventType ratio/proportion, 5-level) on the same streamId — the
# same pattern as Plan-77 §1, and since 2026-09-15 carrying the same flag.
#
# These 28 presence twins shipped un-deprecated in 1.12.0 while §1's identical
# twins were deprecated, so the model said two different things about one pattern.
# They are now `deprecated: true` as well, which here means "hidden from pickers",
# NOT "do not write": presence-only sources keep writing them. Nothing referenced
# these keys when the flag was added, so no writer or reader was affected.
# 5-level hooks 0.0/0.25/0.5/0.75/1.0 (semantic anchors; see DESIGN-NOTES.md).
# FHIR (plan 133): the blocks of symptom.yaml's header; YAML anchors are per file, so the shared component parts
# (&symptomSeverity*) are defined again in the first -severity block here.

## Respiratory
symptom-respiratory-cough:
  version: v1
  label:
    en: Cough
    fr: Toux
  description:
    en: "Coughing. Presence marker for sources that record occurrence only (no grade); use symptom-respiratory-cough-severity when a severity is known."
    fr: "Toux. Marqueur de présence pour les sources qui n'enregistrent que l'occurrence (sans échelle) ; utiliser symptom-respiratory-cough-severity lorsqu'une sévérité est connue."
  deprecated: true
  streamId: symptom-respiratory-cough
  eventType: activity/plain
  type: checkbox
  repeatable: unlimited
  references:
    snomed: ["49727002"]
  fhir:
    resourceType: Observation
    category: symptom
    alsoMatchCategories: [survey, exam]
    code: { system: http://loinc.org, code: 75325-1, display: Symptom }
    value:
      kind: fixed-coded
      codings:
        - { system: http://snomed.info/sct, code: "49727002", display: Cough }
    effective: { from: span }
    profiles: {}

symptom-respiratory-cough-severity:
  version: v1
  label:
    en: Cough
    fr: Toux
  description:
    en: Coughing.
    fr: Toux.
  streamId: symptom-respiratory-cough
  eventType: ratio/proportion
  type: select
  options: &sev5
    - value: 0.0
      label:
        en: None
        fr: Aucun
    - value: 0.25
      label:
        en: Slight
        fr: Léger
    - value: 0.5
      label:
        en: Moderate
        fr: Modéré
    - value: 0.75
      label:
        en: Severe
        fr: Sévère
    - value: 1.0
      label:
        en: Extreme
        fr: Extrême
  repeatable: unlimited
  references:
    snomed: ["49727002"]
  fhir:
    resourceType: Observation
    category: symptom
    alsoMatchCategories: [survey, exam]
    code: { system: http://loinc.org, code: 75325-1, display: Symptom }
    value:
      kind: fixed-coded
      codings:
        - { system: http://snomed.info/sct, code: "49727002", display: Cough }
      component:
        absent: symptom-respiratory-cough
        code: &symptomSeverityCode { system: http://loinc.org, code: 64750-3, display: Severity of symptoms }
        options: &symptomSeverityOptions
          "0": { system: http://loinc.org, code: LA137-2, display: None }
          "0.25": { system: http://loinc.org, code: LA6752-5, display: Mild }
          "0.5": { system: http://loinc.org, code: LA6751-7, display: Moderate }
          "0.75": { system: http://loinc.org, code: LA6750-9, display: Severe }
          "1": { system: http://loinc.org, code: LA11912-5, display: Extreme }
        alsoMatch: &symptomSeverityAlsoMatch
          "0":
            - { system: http://snomed.info/sct, code: "260413007", display: None }
          "0.25":
            - { system: http://loinc.org, code: LA11910-9, display: Slight }
            - { system: http://snomed.info/sct, code: "255604002", display: Mild }
            - { system: http://snomed.info/sct, code: "255510006", display: Slight }
            - { system: http://snomed.info/sct, code: "162468002", display: Symptom mild }
          "0.5":
            - { system: http://snomed.info/sct, code: "6736007", display: Moderate severity }
            - { system: http://snomed.info/sct, code: "162469005", display: Symptom moderate }
          "0.75":
            - { system: http://snomed.info/sct, code: "24484000", display: Severe }
            - { system: http://snomed.info/sct, code: "162470006", display: Symptom severe }
          "1":
            - { system: http://loinc.org, code: LA13958-6, display: Very severe }
            - { system: http://snomed.info/sct, code: "12565001", display: Extreme }
            - { system: http://snomed.info/sct, code: "162471005", display: Symptom very severe }
        negation: &symptomSeverityNegation { option: "0", code: { system: http://loinc.org, code: 111551-8, display: Symptom absent } }
    effective: { from: span }
    profiles: {}

