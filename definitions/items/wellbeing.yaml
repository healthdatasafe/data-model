          label:
            en: Pleasant
            fr: Agréable
        - value: 1.0
          label:
            en: Very pleasant
            fr: Très agréable
    arousal:
      label:
        en: Energy
        fr: Énergie
      type: select
      canBeNull: true
      options:
        - value: 0.0
          label:
            en: Very calm
            fr: Très calme
        - value: 0.25
          label:
            en: Calm
            fr: Calme
        - value: 0.5
          label:
            en: Moderate
            fr: Modéré
        - value: 0.75
          label:
            en: Energized
            fr: Énergique
        - value: 1.0
          label:
            en: Very energized
            fr: Très énergique
    dominance:
      label:
        en: Sense of control
        fr: Sentiment de contrôle
      type: select
      canBeNull: true
      options:
