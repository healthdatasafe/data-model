# Mental distress — summary severity ratings over a reference period.
# Distinct from wellbeing-mood (momentary affective state); see documentation/SYMPTOMS.md
# design decision #2 (revised) and documentation/MOOD.md for the construct distinction.
# Ships three items to support both combined-PRO forms (EQ-5D D5, K6/K10, WHO-5 inverse)
# and splitting-PRO forms (PHQ, GAD, HADS, DASS-21, PROMIS Emotional Distress).
# Reader convention: when combined + split events coexist at the same time, the split
# subscales are primary; the combined event is a derived/coarser view of the same episode.

wellbeing-mental-distress:
  version: v1
  label:
    en: Mental distress (combined)
    fr: Détresse mentale (combinée)
  description:
    en: Anxiety and low mood, combined.
    fr: Anxiété et humeur basse, combinées.
  streamId: wellbeing-mental-distress
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.0
      label:
        en: Not anxious or depressed
        fr: Ni anxieux ni déprimé
    - value: 0.25
      label:
        en: Slightly anxious or depressed
        fr: Légèrement anxieux ou déprimé
    - value: 0.5
      label:
        en: Moderately anxious or depressed
        fr: Modérément anxieux ou déprimé
    - value: 0.75
      label:
        en: Severely anxious or depressed
        fr: Sévèrement anxieux ou déprimé
    - value: 1.0
      label:
        en: Extremely anxious or depressed
        fr: Extrêmement anxieux ou déprimé
  repeatable: unlimited
  references:
    snomed: ["48694002", "366979004"]

wellbeing-mental-distress-anxiety:
  version: v1
  label:
    en: Anxiety severity
    fr: Sévérité de l'anxiété
  description:
    en: Anxiety symptoms.
    fr: Symptômes d'anxiété.
  streamId: wellbeing-mental-distress-anxiety
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.0
      label:
        en: Not anxious
        fr: Pas anxieux
    - value: 0.25
      label:
        en: Slightly anxious
        fr: Légèrement anxieux
    - value: 0.5
      label:
        en: Moderately anxious
        fr: Modérément anxieux
    - value: 0.75
      label:
        en: Severely anxious
        fr: Sévèrement anxieux
    - value: 1.0
      label:
        en: Extremely anxious
        fr: Extrêmement anxieux
  repeatable: unlimited
  references:
    snomed: ["48694002"]
  # No LOINC (B-2026-10-28-41): 69737-5, asserted until 3.32.0, is the GAD-7 panel, and the GAD-7 total (70274-6)
  # is a 0-21 score, not this five-level answer.

wellbeing-mental-distress-depression:
  version: v1
  label:
    en: Depression severity
    fr: Sévérité de la dépression
  description:
    en: Depression symptoms.
    fr: Symptômes de dépression.
  streamId: wellbeing-mental-distress-depression
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.0
      label:
        en: Not depressed
        fr: Pas déprimé
    - value: 0.25
      label:
        en: Slightly depressed
        fr: Légèrement déprimé
    - value: 0.5
      label:
        en: Moderately depressed
        fr: Modérément déprimé
    - value: 0.75
      label:
        en: Severely depressed
        fr: Sévèrement déprimé
    - value: 1.0
      label:
        en: Extremely depressed
        fr: Extrêmement déprimé
  repeatable: unlimited
  references:
    snomed: ["366979004"]
  # No LOINC (B-2026-10-28-41): 75275-8, asserted until 3.32.0, is "Cognitive function [Interpretation]". The
  # PHQ-9 total (44261-6) is a 0-27 score, not this five-level answer.

# Stress — the third dimension of the validated DASS-21 (Depression/Anxiety/Stress)
# triad, completing the mental-distress domain alongside -anxiety and -depression.
# A distinct construct from the -combined item (which is anxiety + low mood).
wellbeing-mental-distress-stress:
  version: v1
  label:
    en: Stress severity
    fr: Sévérité du stress
  description:
    en: Stress symptoms.
    fr: Symptômes de stress.
  streamId: wellbeing-mental-distress-stress
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.0
      label:
        en: Not stressed
        fr: Pas stressé
    - value: 0.25
      label:
        en: Slightly stressed
        fr: Légèrement stressé
    - value: 0.5
      label:
        en: Moderately stressed
        fr: Modérément stressé
    - value: 0.75
      label:
        en: Severely stressed
        fr: Sévèrement stressé
    - value: 1.0
      label:
        en: Extremely stressed
        fr: Extrêmement stressé
  repeatable: unlimited
  references:
    snomed: ["73595000", "224974006"]

# ── Presence twins for the anxiety / stress pair (B-2026-09-15-7) ────────────
# Both streams were `ratio/proportion` ONLY, so a source that reports "anxious"
# with no grade had nowhere correct to write: 0 contradicts the report, any
# positive value fabricates a grade the subject never gave, and skipping loses
# the report. bridge-mira wrote 0.25 — which on the graded item is literally the
# option "Slightly anxious", so an ungraded report was stored indistinguishably
# from a real one.
#
# Keyed `<streamId>-presence`, NOT at the base key as the other 57 twin pairs
# are. That pattern is an artefact of order: in 3.2.0 the presence items already
# existed and the graded twins were added with a suffix. Here the graded item
# came first and keeps its key, so the same rule — the pre-existing item keeps
# its key, the new twin takes the suffix — produces the mirror-image naming.
# Renaming the graded item instead would have silently changed the eventType
# behind a published key, which the deprecated-alias mechanism cannot cover
# (an alias must keep the same streamId AND eventType).

wellbeing-mental-distress-anxiety-presence:
  version: v1
  label:
    en: Anxiety
    fr: Anxiété
  description:
    en: "Anxiety symptoms. Presence marker for sources that record occurrence only (no grade); use wellbeing-mental-distress-anxiety when a severity is known."
    fr: "Symptômes d'anxiété. Marqueur de présence pour les sources qui n'enregistrent que l'occurrence (sans échelle) ; utiliser wellbeing-mental-distress-anxiety lorsqu'une sévérité est connue."
  deprecated: true
  streamId: wellbeing-mental-distress-anxiety
  eventType: activity/plain
  type: checkbox
  repeatable: unlimited
  references:
    snomed: ["48694002"]

wellbeing-mental-distress-stress-presence:
  version: v1
  label:
    en: Stress
    fr: Stress
  description:
    en: "Stress symptoms. Presence marker for sources that record occurrence only (no grade); use wellbeing-mental-distress-stress when a severity is known."
    fr: "Symptômes de stress. Marqueur de présence pour les sources qui n'enregistrent que l'occurrence (sans échelle) ; utiliser wellbeing-mental-distress-stress lorsqu'une sévérité est connue."
  deprecated: true
  streamId: wellbeing-mental-distress-stress
  eventType: activity/plain
  type: checkbox
  repeatable: unlimited
  references:
    snomed: ["73595000", "224974006"]

# Self-rated health ("SRH") — the most validated single-item PRO in epidemiology.
# Two capture formats, two items: this continuous 0..100 VAS (stored 0..1 at step
# 0.01), and the 5-level categorical question (SF-1 / RAND-36 item 1 / PROMIS
# Global01 / NHIS SRH) as `wellbeing-general-health` below. The VAS stays HDS-only:
# no FHIR mapping (licensing of the EQ VAS anchors: B-2026-10-28-42).

wellbeing-self-rated-health:
  version: v1
  label:
    en: Self-rated health
    fr: Auto-évaluation de la santé
  description:
    en: Your overall health today.
    fr: Votre état de santé global aujourd'hui.
  streamId: wellbeing-self-rated-health
  eventType: ratio/proportion
  type: slider
  min: 0
  max: 1
  step: 0.01
  slider:
    # orientation defaults to "horizontal" — matches typical web form UX
    display:
      multiplier: 100   # patient sees 0..100 on the slider; storage is raw 0..1
      precision: 0
      suffix:
        en: /100
        fr: /100
    labels:
      0:
        label:
          en: Worst health
          fr: Pire santé
        description:
          en: The worst health you can imagine
          fr: La pire santé que vous puissiez imaginer
      1:
        label:
          en: Best health
          fr: Meilleure santé
        description:
          en: The best health you can imagine
          fr: La meilleure santé que vous puissiez imaginer
  repeatable: unlimited
  # No `references`: no standard code fits this 0..100 scale. The SNOMED ids once
  # listed ("425058002", "104346004") are not valid SCTIDs, and the LOINC codes were
  # wrong: 72006-0 is the VR-36 physical functioning T-score, 32622-6 does not exist,
  # 82589-3 is "Highest level of education" (checked 2026-10-28). Add a code only
  # once one with this exact meaning is verified (snomed-db, tx.fhir.org).

# General health: the 5-level self-rated health question. Wording from the RAND
# 36-Item Health Survey 1.0, item 1 (RAND, public domain; the same question as SF-36
# item 1, SF-1 and PROMIS Global01): "In general, would you say your health is:
# Excellent / Very good / Good / Fair / Poor".
#
# Direction: HIGHER IS BETTER HEALTH (excellent 1.0 … poor 0.0), the reverse of the
# severity items above. Hooks on the canonical 5-level positions (DESIGN-NOTES.md).
# FHIR: LOINC 61577-3 with its answer list LL1012-5. The generic 11323-3 "General
# health - Reported" has no answer list, so it cannot carry these answers.
wellbeing-general-health:
  version: v1
  label:
    en: General health
    fr: Santé générale
  description:
    en: "In general, would you say your health is:"
    fr: "En général, diriez-vous que votre santé est :"
  streamId: wellbeing-general-health
  eventType: ratio/proportion
  type: select
  options:
    - value: 1.0
      label:
        en: Excellent
        fr: Excellente
    - value: 0.75
      label:
        en: Very good
        fr: Très bonne
    - value: 0.5
      label:
        en: Good
        fr: Bonne
    - value: 0.25
      label:
        en: Fair
        fr: Médiocre
    - value: 0.0
      label:
        en: Poor
        fr: Mauvaise
  repeatable: unlimited
  references:
    loinc: ["61577-3"]
  fhir:
    resourceType: Observation
    category: survey
    code: { system: http://loinc.org, code: 61577-3, display: "In general, would you say your health is [PROMIS]" }
    value:
      kind: coded
      # keyed by the option value as a string
      options:
        "1": { system: http://loinc.org, code: LA9206-9, display: Excellent }
        "0.75": { system: http://loinc.org, code: LA13913-1, display: Very Good }
        "0.5": { system: http://loinc.org, code: LA8967-7, display: Good }
        "0.25": { system: http://loinc.org, code: LA8968-5, display: Fair }
        "0": { system: http://loinc.org, code: LA8969-3, display: Poor }
      # SNOMED CT findings per answer, accepted on import only; SNOMED CT has none for "very good".
      alsoMatch:
        "1": [{ system: http://snomed.info/sct, code: "135816001", display: General health excellent }]
        "0.5": [{ system: http://snomed.info/sct, code: "135815002", display: General health good }]
        "0.25": [{ system: http://snomed.info/sct, code: "135817005", display: General health fair }]
        "0": [{ system: http://snomed.info/sct, code: "135818000", display: General health poor }]
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-screening-assessment
