wellbeing-sex-drive:
  version: v1
  label:
    en: Sex Drive
    fr: Libido
  description:
    en: Your level of sexual desire.
    fr: Votre niveau de désir sexuel.
  streamId: wellbeing-sex-drive
  eventType: ratio/proportion
  type: select
  options:
