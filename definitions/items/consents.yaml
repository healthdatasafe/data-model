consent-record:
  version: v1
  type: system
  label:
    en: Consent record
    fr: Historique des consentements
    es: Registro de consentimientos
  description:
    en: Your consents, your choices and the notices you acknowledged, and when.
    fr: Vos consentements, vos choix et les notices prises en compte, et quand.
    es: Sus consentimientos, sus elecciones y los avisos reconocidos, y cuándo.
  streamId: consents
  eventType: consent/record-v1
  repeatable: unlimited
  devNotes: >-
    Append-only history of the account-level consents (plan 91): one event per act, never updated in place; the
    current state of a document is its latest event. Written by the account app with the personal token at
    signup, at re-consent and from the Privacy & Consents center. Withdrawing `health-processing` (or `us-chd-consent`
    under US residence) is account deletion: export, then delete, no event written. An optional choice (the research
    opt-in) records yes as `given` and no as `declined`, or `withdrawn` after a yes; the account stays. No app requests access to this stream. See
    documentation/CONSENTS.md.
