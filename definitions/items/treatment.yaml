treatment-basic:
  version: v1
  label:
    en: Treatment (free-text)
    fr: Traitement (texte libre)
  description:
    en: A clinical treatment, entered as free text.
    fr: Un traitement clinique, saisi en texte libre.
  streamId: treatment
  eventType: treatment/basic
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 1576800000 # 50 years (site-agents#32): lifelong regimens. UI hint only, not validated. Ongoing use is duration null, not a long span.
  type: composite
  composite:
    name:
      label: Treatment name
      type: text
    count:
      label: Number of times (lifetime)
      type: number
      canBeNull: true
    notes:
      label: Notes
      type: text
      canBeNull: true
  repeatable: unlimited
  # A Procedure over a period (documentation/TREATMENT-PROCEDURE.md § FHIR): the name as written is `code.text`, `notes`
  # the `note`, and `status` comes from the span (open: in-progress; ended: completed; a point: unknown). `count` is never
  # rendered, and an event that carries one is a lifetime tally, no Procedure at all. Imported by the `meta.tag` of an HDS
  # export or by a named item only: any other Procedure is a procedure.
  fhir:
    resourceType: Procedure
    code: { from: text, field: name }
    status: { from: span }
    ignore: [count]
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-procedure
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Procedure-uv-ips
  devNotes: >-
    Examples: IVF, chemotherapy, CBT, dialysis.

treatment-coded:
  version: v1
  label:
    en: Treatment (coded)
    fr: Traitement (codé)
  description:
    en: A clinical treatment you receive or received.
    fr: Un traitement clinique que vous recevez ou avez reçu.
  streamId: treatment
  eventType: treatment/coded-v1
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 1576800000 # 50 years (site-agents#32): lifelong regimens. UI hint only, not validated. Ongoing use is duration null, not a long span.
  type: datasource-search
  datasource: treatment
  repeatable: unlimited
  # The coded regimen (`regimen.codes`, through fhirMapping.systems) is `Procedure.code`; the rest as the basic twin. The
  # scope key is the bare `Procedure`, as the procedure items: this root is its second grant root.
  fhir:
    resourceType: Procedure
    code: { from: datasource, field: regimen }
    status: { from: span }
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-procedure
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Procedure-uv-ips
