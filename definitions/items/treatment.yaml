treatment-basic:
  version: v1
  label:
    en: Treatment (free-text)
    fr: Traitement (texte libre)
  description:
    en: A clinical treatment, entered as free text.
    fr: Un traitement clinique, saisi en texte libre.
  streamId: treatment
  eventType: treatment/basic
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 315360000 # 10 years — accommodates lifelong HRT, multi-year IVF journey, chemotherapy regimens
  type: composite
  composite:
    name:
      label: Treatment name
      type: text
    count:
      label: Number of times (lifetime)
      type: number
      canBeNull: true
    notes:
      label: Notes
      type: text
      canBeNull: true
  repeatable: unlimited
  devNotes: >-
    Examples: IVF, chemotherapy, CBT, dialysis.

treatment-coded:
  version: v1
  label:
    en: Treatment (coded)
    fr: Traitement (codé)
  description:
    en: Search and select a coded clinical treatment.
    fr: Recherchez et sélectionnez un traitement clinique codé.
  streamId: treatment
  eventType: treatment/coded-v1
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 315360000 # 10 years
  type: datasource-search
  datasource: treatment
  repeatable: unlimited
