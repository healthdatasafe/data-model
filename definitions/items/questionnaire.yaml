# The questionnaire request / answer pair (documentation/QUESTIONNAIRE.md). Neither is entered through a form field:
# an app writes the request it materializes and the answer event of one filling. In FHIR the request is a
# Questionnaire and the answer a QuestionnaireResponse (documentation/FHIR-MAPPING.md), each under its own scope key.
questionnaire-request:
  version: v1
  type: system
  label:
    en: Questionnaires received
    fr: Questionnaires reçus
  description:
    en: A questionnaire you were asked to answer.
    fr: Un questionnaire auquel on vous a demandé de répondre.
  streamId: questionnaire-request
  eventType: questionnaire/request-v1
  repeatable: any
  # One request event is one Questionnaire, rendered from the event alone (FHIR-MAPPING.md § Questionnaire): its `url`
  # is the canonical an answer's `QuestionnaireResponse.questionnaire` names. No code and no category: the resource
  # has neither, and the scope key is the bare resourceType, granted on this stream alone. No profile is claimed on
  # any flavour (`profiles: {}`, the base resource). Adding a profile later is additive; withdrawing one is not.
  fhir:
    resourceType: Questionnaire
    profiles: {}
  devNotes: >-
    One event per questionnaire asked of the person (QUESTIONNAIRE.md), rendered in FHIR as the `Questionnaire` an
    answer's `QuestionnaireResponse.questionnaire` names. Its stream is a sibling of `questionnaire-answer`, so each
    is granted alone (`patient/Questionnaire.rs`, `patient/QuestionnaireResponse.rs`). A grant on this stream reads
    the question texts of every requester and, on the Pryv API, `content.requester.relationship`, the base id of the
    access the person gave the requester: an opaque id, meaningful in her account only, accepted here because the root
    is `explicitGrantOnly` (plan 115, 2026-11-16). The FHIR rendering leaves `requester` out.

questionnaire-answer:
  version: v1
  type: system
  label:
    en: Questionnaire answers
    fr: Réponses aux questionnaires
  description:
    en: Your answers to one questionnaire.
    fr: Vos réponses à un questionnaire.
  streamId: questionnaire-answer
  eventType: questionnaire/answer-v1
  repeatable: any
  # One answer event is one QuestionnaireResponse, rendered from the event alone (FHIR-MAPPING.md §
  # QuestionnaireResponse). No code and no category: the resource has neither, and the scope key is the bare
  # resourceType. No profile is claimed on any flavour yet (`profiles: {}`, the base resource): a claim on
  # `us-core-questionnaireresponse` comes with the Questionnaire mapping, when the question text can be rendered.
  # Adding a profile later is additive; withdrawing one is not.
  fhir:
    resourceType: QuestionnaireResponse
    profiles: {}
  devNotes: >-
    One event per filling; an edit is a new event and the latest per `requestEventId` is current (QUESTIONNAIRE.md
    § Update semantics). A SMART grant reaches an answer only when the event is in this stream (or below it): an
    answer event written elsewhere (an app's own scope) is outside every FHIR grant. The root is `explicitGrantOnly`:
    only an access naming it or this stream reads the answers.
