## Cervical Position

body-vulva-cervix-position:
  version: v2
  label:
    en: Cervical Position
    fr: Position du col utérin
  description:
    en: Self-checked cervix — height, firmness, openness, and tilt.
    fr: Col auto-examiné — hauteur, fermeté, ouverture et inclinaison.
  streamId: body-vulva-cervix-position
  eventType: cervix-position/3d-vectors
  type: composite
  composite:
    height:
      label:
        en: Height
        fr: Hauteur
      type: select
      canBeNull: true
      options:
        - value: 0.0
          label:
            en: Low
            fr: Bas
        - value: 0.5
          label:
            en: Medium
            fr: Moyen
        - value: 1.0
          label:
            en: High
            fr: Haut
    firmness:
      label:
        en: Firmness
        fr: Fermeté
      type: select
      canBeNull: true
      options:
        - value: 0.0
          label:
            en: Firm
            fr: Ferme
        - value: 0.5
          label:
            en: Medium
            fr: Moyen
        - value: 1.0
          label:
            en: Soft
            fr: Souple
    openness:
      label:
        en: Openness
        fr: Ouverture
      type: select
      canBeNull: true
      options:
        - value: 0.0
          label:
            en: Closed
            fr: Fermé
        - value: 0.5
          label:
            en: Medium
            fr: Moyen
        - value: 1.0
          label:
            en: Open
            fr: Ouvert
    tilt:
      label:
        en: Tilt
        fr: Inclinaison
      type: select
      canBeNull: true
      options:
        - value: 0.0
          label:
            en: Straight
            fr: Droit
        - value: 0.5
          label:
            en: Medium
            fr: Moyen
        - value: 1.0
          label:
            en: Tilted
            fr: Incliné
  repeatable: P1D
