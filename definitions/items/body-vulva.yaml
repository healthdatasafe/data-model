## MUCUS

body-vulva-mucus-inspect:
  version: v2
  label:
    en: Cervical Fluid Inspect
    fr: Observation de la glaire cervicale
  description:
    en: Your cervical fluid observation for today.
    fr: Votre observation de glaire cervicale pour aujourd'hui.
  streamId: body-vulva-mucus-inspect
  eventType: vulva-mucus-inspect/9d-vector
  type: convertible
  converter-engine:
    key: euclidian-distance
    version: v0
    models: cervical-fluid
  repeatable: unlimited
  devNotes: >-
    Stored as a 9-dimensional vector and convertible across charting methods (Apple Health,
    Creighton, Billings, Mira, …) through the cervical-fluid converter.
body-vulva-mucus-inspect-count:
  version: v1
  label:
    en: Cervical Fluid observation count
    fr: Nombre d'observations de glaire
  description:
    en: How many times you checked your cervical fluid today.
    fr: Combien de fois vous avez observé votre glaire aujourd'hui.
  streamId: body-vulva-mucus-inspect
  eventType: count/generic
  type: number
  repeatable: once
  devNotes: >-
    The Creighton FertilityCare protocol records the most-fertile observation of the day plus
    the number of times observations were made, typically at each bathroom visit.
body-vulva-mucus-stretch:
  version: v1
  deprecated: true
  label: Cervical Fluid Stretch
  description: Manual strech test of cervical fluid. Short can be streched less than 2 cm, long greater than 2cm. 
  streamId: body-vulva-mucus-stretch
  eventType: ratio/generic
  type: select
  options:
    - value: 0
      label: No Strech
    - value: 1
      label: Short
    - value: 2
      label: Long
  repeatable: unlimited

## WETNESS

body-vulva-wetness-feeling:
  version: v1
  deprecated: true
  label: Vulva Wetness feeling
  description: Vulva wetness feeling 
  streamId: body-vulva-wetness-feeling
  eventType: ratio/generic
  type: select
  options:
    - value: 0
      label: Dry
    - value: 1
      label: Wet
    - value: 2
      label: Very wet
  repeatable: unlimited
body-vulva-wetness-wiping:
  version: v1
  deprecated: true
  # Deprecated 2026-09-18 (plan 100, finding F10). Superseded by
  # `body-vulva-mucus-inspect`, whose 9D cervical-fluid vector covers this observation.
  #
  # Plan 48 deprecated two siblings that duplicate a converter dimension,
  # `body-vulva-mucus-stretch` (-> stretchability) and `body-vulva-wetness-feeling`
  # (-> sensation), and left this one active with no recorded reason. Plan 16 had
  # deliberately kept the per-field converters, so plan 48 half-unwound an earlier
  # decision rather than simply overlooking this item. Its *option* labels are
  # identical to `body-vulva-wetness-feeling`'s (Dry / Wet / Very wet) and it shares the
  # same `ratio/generic` eventType.
  #
  # How the observation survives: in the chartneo converter method both `walking` and
  # `wiping` write the same three dimensions (`sensation`, `wetness`, `lubricative`)
  # with `vectorMerge: max`, so the vector holds max(walking, wiping) rather than
  # isolating wiping. The raw per-field value is preserved separately on the event's
  # `content.source.sourceData`, which is what makes this lossless.
  #
  # Existing events stay readable; the item is simply no longer offered for new ones.
  # Writers at deprecation time: `bridge-chartneo` (stopped 2026-09-18, it was already
  # folding `WipingID` into the vector) and `reference/sample-datasets`
  # (`src/datasets/full-model.ts`), which already writes other deprecated items.
  label:
    en: Vulva Wetness when wiping
    fr: Sensation d'humidité vulvaire à l'essuyage
  description:
    en: Deprecated. Record cervical-fluid observations with Cervical fluid observation instead.
    fr: Obsolète. Utilisez plutôt l'observation de la glaire cervicale.
  streamId: body-vulva-wetness-wiping
  eventType: ratio/generic
  type: select
  options:
    - value: 0
      label: Dry
    - value: 1
      label: Wet
    - value: 2
      label: Very wet
  repeatable: unlimited

## Bleeding
body-vulva-bleeding:
  version: v2
  label:
    en: Bleeding intensity
    fr: Intensité du saignement
  description:
    en: How heavy your bleeding is.
    fr: L'intensité de votre saignement.
  streamId: body-vulva-bleeding
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.0
      label:
        en: None
        fr: Aucun
    - value: 0.08
      label:
        en: Spotting
        fr: Spotting
    - value: 0.20
      label:
        en: Very light
        fr: Très léger
    - value: 0.35
      label:
        en: Light
        fr: Léger
    - value: 0.55
      label:
        en: Moderate
        fr: Modéré
    - value: 0.75
      label:
        en: Heavy
        fr: Abondant
    - value: 0.95
      label:
        en: Very heavy
        fr: Très abondant
  repeatable: unlimited
  devNotes: >-
    Subjective intensity, stored on `ratio/proportion` as 0..1.

body-vulva-bleeding-browndark:
  version: v1
  label:
    en: Brown/dark coloration
    fr: Coloration brune ou foncée
  description:
    en: Brown or dark coloration in the bleeding.
    fr: Coloration brune ou foncée du saignement.
  streamId: body-vulva-bleeding-browndark
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: >-
    Qualifier for a co-occurring `body-vulva-bleeding` event.

body-vulva-bleeding-clots:
  version: v1
  label:
    en: Blood clots
    fr: Caillots sanguins
  description:
    en: Blood clots during bleeding.
    fr: Caillots de sang pendant le saignement.
  streamId: body-vulva-bleeding-clots
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: >-
    Qualifier for a co-occurring `body-vulva-bleeding` event.

body-vulva-bleeding-postpartum:
  version: v1
  label:
    en: Postpartum Bleeding
    fr: Saignement du post-partum
  description:
    en: Vaginal bleeding after childbirth.
    fr: Saignement vaginal après l'accouchement.
  streamId: body-vulva-bleeding-postpartum
  eventType: activity/plain
  type: checkbox
  repeatable: P1D
  devNotes: >-
    Lochia.

body-vulva-bleeding-miscarriage:
  version: v1
  label:
    en: Miscarriage Bleeding
