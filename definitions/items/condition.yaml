condition-coded:
  version: v1
  label:
    en: Condition (coded)
    fr: Affection (codée)
  description:
    en: Search and select a coded clinical diagnosis.
    fr: Recherchez et sélectionnez un diagnostic clinique codé.
  streamId: condition
  eventType: condition/coded-v1
  duration:
    mandatory: false
    canBeNull: false # time + duration is the abatement (4.1.0). No duration: abatement unknown, never "ongoing" (content.status says that)
    maxSeconds: 3153600000 # 100 years: a lifelong condition. UI hint only, not validated.
  type: datasource-search
  datasource: condition
  repeatable: unlimited
  fhir:
    resourceType: Condition
    category: problem-list-item
    # Import only: an encounter diagnosis is a clinician's diagnosis too, what this item holds. A
    # health concern (often a social finding: housing, education) is not, and does not import here.
    alsoMatchCategories: [encounter-diagnosis]
    code: { from: datasource, field: condition }
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-condition-problems-health-concerns
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Condition-uv-ips
  devNotes: >-
    event.time is the onset (or the diagnosis date when that is all the source knows). Optional content.status is the
    FHIR clinicalStatus code (active, recurrence, relapse, inactive, remission, resolved); absent = not stated.
    An abated condition carries event.duration, time + duration being the abatement, and then status must be inactive,
    remission or resolved (FHIR con-4). No abatement is no duration key: never 0, never null. 0 is a real value (abated
    within the onset's own period) and needs an abated status like any duration. Partial onset and abatement dates
    follow PARTIAL-DATES.md (hdsTimePrecision, hdsEndPrecision). content.verificationStatus is reserved for the FHIR
    verification status (not stored yet). See documentation/CONDITION.md.
