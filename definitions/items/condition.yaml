condition-coded:
  version: v1
  label:
    en: Condition (coded)
    fr: Affection (codée)
  description:
    en: Search and select a coded clinical diagnosis.
    fr: Recherchez et sélectionnez un diagnostic clinique codé.
  streamId: condition
  eventType: condition/coded-v1
  type: datasource-search
  datasource: condition
  repeatable: unlimited
  fhir:
    resourceType: Condition
    category: problem-list-item
    # Import only: an encounter diagnosis is a clinician's diagnosis too, what this item holds. A
    # health concern (often a social finding: housing, education) is not, and does not import here.
    alsoMatchCategories: [encounter-diagnosis]
    code: { from: datasource, field: condition }
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-condition-problems-health-concerns
      ips: http://hl7.org/fhir/uv/ips/StructureDefinition/Condition-uv-ips
