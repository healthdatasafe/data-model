## Pain / Musculoskeletal
symptom-pain-severity:
  version: v1
  label:
    en: Overall pain severity
    fr: Sévérité globale de la douleur
  description:
    en: Overall pain or discomfort.
    fr: Douleur ou inconfort global.
  streamId: symptom-pain-severity
  eventType: ratio/proportion
  type: select
  options:
    - value: 0.0
      label:
        en: No pain or discomfort
        fr: Aucune douleur ni inconfort
    - value: 0.25
      label:
        en: Slight pain or discomfort
        fr: Légère douleur ou inconfort
    - value: 0.5
      label:
        en: Moderate pain or discomfort
        fr: Douleur ou inconfort modéré
    - value: 0.75
      label:
        en: Severe pain or discomfort
        fr: Douleur ou inconfort sévère
    - value: 1.0
      label:
        en: Extreme pain or discomfort
        fr: Douleur ou inconfort extrême
  repeatable: unlimited
  # Not LOINC 72514-3 ("Pain severity - 0-10 verbal numeric rating [Score] - Reported"): that is a
  # 0 to 10 numeric score, while this item stores five verbal levels as a ratio. A 0 to 10 score maps
  # onto these levels only through a binning rule, which this model does not define; no LOINC code
  # with exactly these five levels was found.
  # Removed 2026-10-29 (plan 115): LOINC 77564-4, unknown to LOINC 2.83 (tx.fhir.org $lookup), and SNOMED 103325001
  # "Patient need for (contextual qualifier) (qualifier value)", a qualifier, not a pain concept.
  references:
    snomed: ["22253000", "225908003"]
    loinc: ["38208-5"]
    icd10: ["R52"]
  fhir:
    resourceType: Observation
    category: symptom
    alsoMatchCategories: [survey, exam]
    code: { system: http://loinc.org, code: 38208-5, display: "Pain severity - Reported" }
    value:
      kind: coded
      options: *symptomSeverityOptions
      alsoMatch: *symptomSeverityAlsoMatch
    effective: { from: span }
    profiles: {}

