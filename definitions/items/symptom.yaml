# Symptom items — self-reported symptom observations.
# See documentation/SYMPTOMS.md for cross-system compatibility research
# (Apple HealthKit, SNOMED CT, FHIR, Ovia, Mira).
#
# Model (Plan 77 / data-model#19):
#   - symptom-<...>          : presence marker (eventType activity/plain). `deprecated: true`
#                             here means "hidden from pickers", NOT "do not write": presence-only
#                             sources (bridges relaying a flag with no grade) are expected to keep
#                             writing it, and existing events keep resolving. The published
#                             `description` says so too — keep it that way, because consumers read
#                             pack.json and cannot see this comment (site-agents#13, 2026-09-15).
#   - symptom-<...>-severity : go-forward item (eventType ratio/proportion, 5-level severity
#                             None/Slight/Moderate/Severe/Extreme). Write it only when a grade is
#                             actually known; there is no honest value for "reported, ungraded"
#                             (0 means None).
# Both itemDefs share the same streamId (identity is streamId:eventType).
# 5-level hooks 0.0/0.25/0.5/0.75/1.0 — semantic anchors (see DESIGN-NOTES.md); 4-level
# sources (Apple HKCategoryValueSeverity, Mira level, MSQ 0–3) map as a subset by label.
#
# Categories follow clinical body-system groupings.
#
# FHIR (plan 133): every item is an Observation|symptom (HDS category). A pair is LOINC 75325-1 "Symptom" with the
# finding as a fixed-coded value; the -severity item adds a 64750-3 component (LL4051-0 answers, by-label import-only
# answers, "0" rendered as 111551-8 "Symptom absent") and names its presence twin. symptom-pain-severity is coded under
# 38208-5. The shared component parts are YAML anchors (&symptomSeverity*), defined in the first -severity block of
# this file. See documentation/FHIR-MAPPING.md, "Symptoms", and documentation/SYMPTOMS.md.

## Gastrointestinal
symptom-gastrointestinal-nausea:
  version: v1
  label: Nausea
  description: Presence marker for sources that record occurrence only (no grade); use symptom-gastrointestinal-nausea-severity when a severity is known.
  deprecated: true
  streamId: symptom-gastrointestinal-nausea
  eventType: activity/plain
  type: checkbox
  repeatable: unlimited
  fhir:
    resourceType: Observation
    category: symptom
    alsoMatchCategories: [survey, exam]
    code: { system: http://loinc.org, code: 75325-1, display: Symptom }
    value:
      kind: fixed-coded
      codings:
        - { system: http://snomed.info/sct, code: "422587007", display: Nausea }
    effective: { from: span }
    profiles: {}

symptom-gastrointestinal-nausea-severity:
  version: v1
  label:
    en: Nausea
    fr: Nausée
  description:
    en: Feeling of nausea or urge to vomit.
    fr: Sensation de nausée ou envie de vomir.
  streamId: symptom-gastrointestinal-nausea
  eventType: ratio/proportion
  type: select
  options: &severity5
    - value: 0.0
      label:
        en: None
        fr: Aucun
    - value: 0.25
      label:
        en: Slight
        fr: Léger
    - value: 0.5
      label:
        en: Moderate
        fr: Modéré
    - value: 0.75
      label:
        en: Severe
        fr: Sévère
    - value: 1.0
      label:
        en: Extreme
        fr: Extrême
  repeatable: unlimited
  references:
    snomed: ["422587007"]
  fhir:
    resourceType: Observation
    category: symptom
    alsoMatchCategories: [survey, exam]
    code: { system: http://loinc.org, code: 75325-1, display: Symptom }
    value:
      kind: fixed-coded
      codings:
        - { system: http://snomed.info/sct, code: "422587007", display: Nausea }
      component:
        absent: symptom-gastrointestinal-nausea
        code: &symptomSeverityCode { system: http://loinc.org, code: 64750-3, display: Severity of symptoms }
        options: &symptomSeverityOptions
          "0": { system: http://loinc.org, code: LA137-2, display: None }
          "0.25": { system: http://loinc.org, code: LA6752-5, display: Mild }
          "0.5": { system: http://loinc.org, code: LA6751-7, display: Moderate }
          "0.75": { system: http://loinc.org, code: LA6750-9, display: Severe }
          "1": { system: http://loinc.org, code: LA11912-5, display: Extreme }
        alsoMatch: &symptomSeverityAlsoMatch
          "0":
            - { system: http://snomed.info/sct, code: "260413007", display: None }
          "0.25":
            - { system: http://loinc.org, code: LA11910-9, display: Slight }
            - { system: http://snomed.info/sct, code: "255604002", display: Mild }
            - { system: http://snomed.info/sct, code: "255510006", display: Slight }
            - { system: http://snomed.info/sct, code: "162468002", display: Symptom mild }
          "0.5":
            - { system: http://snomed.info/sct, code: "6736007", display: Moderate severity }
            - { system: http://snomed.info/sct, code: "162469005", display: Symptom moderate }
          "0.75":
            - { system: http://snomed.info/sct, code: "24484000", display: Severe }
            - { system: http://snomed.info/sct, code: "162470006", display: Symptom severe }
          "1":
            - { system: http://loinc.org, code: LA13958-6, display: Very severe }
            - { system: http://snomed.info/sct, code: "12565001", display: Extreme }
            - { system: http://snomed.info/sct, code: "162471005", display: Symptom very severe }
        negation: &symptomSeverityNegation { option: "0", code: { system: http://loinc.org, code: 111551-8, display: Symptom absent } }
    effective: { from: span }
    profiles: {}

