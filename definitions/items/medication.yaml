medication-intake-basic:
  version: v4
  label:
    en: Medication Intake Basic
    fr: Prise de médicament (simple)
  description:
    en: A medication you took, entered as free text.
    fr: Un médicament que vous avez pris, saisi en texte libre.
  streamId: medication-intake
  eventType: medication/basic
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 1576800000 # 50 years (site-agents#32): lifelong regimens. UI hint only, not validated. Ongoing use is duration null, not a long span.
  type: composite
  composite:
    name:
      label: { en: Name of the medication, fr: Nom du médicament }
      type: text
    intake:
      label: { en: Intake, fr: Prise }
      type: composite
      canBeNull: true
      composite: &medication-regimen-fields # also medication-prescription-basic.posology
        doseValue:
          label: { en: Dose amount, fr: Quantité par prise }
          type: number
          canBeNull: true
        doseUnit:
          label: { en: Dose unit, fr: Unité de dose }
          type: select
          canBeNull: true
          options:
            - value: dose/tablet
              label: { en: Tablet, fr: Comprimé }
            - value: dose/drop
              label: { en: Drop, fr: Goutte }
            - value: dose/puff
              label: { en: Puff, fr: Bouffée }
            - value: dose/application
              label: { en: Application, fr: Application }
            - value: dose/suppository
              label: { en: Suppository, fr: Suppositoire }
            - value: dose/unit
              label: { en: Unit (IU), fr: Unité (UI) }
            - value: mass/mg
              label: { en: mg, fr: mg }
            - value: mass/mcg
              label: { en: μg, fr: μg }
            - value: mass/g
              label: { en: g, fr: g }
            - value: volume/ml
              label: { en: ml, fr: ml }
        route:
          label: { en: Route of administration, fr: Voie d'administration }
          type: select
          canBeNull: true
          options:
            - value: oral
              label: { en: Oral, fr: Oral }
            - value: sublingual
              label: { en: Sublingual, fr: Sublingual }
            - value: topical
              label: { en: Topical, fr: Topique }
            - value: transdermal
              label: { en: Transdermal, fr: Transdermique }
            - value: inhalation
              label: { en: Inhalation, fr: Inhalation }
            - value: nasal
              label: { en: Nasal, fr: Nasal }
            - value: rectal
              label: { en: Rectal, fr: Rectal }
            - value: vaginal
              label: { en: Vaginal, fr: Vaginal }
            - value: ophthalmic
              label: { en: Ophthalmic, fr: Ophtalmique }
            - value: otic
              label: { en: Otic (ear), fr: Auriculaire }
            - value: intravenous
              label: { en: Intravenous (IV), fr: Intraveineux (IV) }
            - value: intramuscular
              label: { en: Intramuscular (IM), fr: Intramusculaire (IM) }
            - value: subcutaneous
              label: { en: Subcutaneous (SC), fr: Sous-cutané (SC) }
        frequency:
          label: { en: How often, fr: Fréquence }
          type: composite
          canBeNull: true
          composite:
            times:
              label: { en: Times, fr: Fois }
              type: number
              canBeNull: true
            period:
              label: { en: Every, fr: Tous les }
              type: number
              canBeNull: true
            periodUnit:
              label: { en: Period, fr: Période }
              type: select
              canBeNull: true
              options:
                - value: h
                  label: { en: Hours, fr: Heures }
                - value: d
                  label: { en: Days, fr: Jours }
                - value: wk
                  label: { en: Weeks, fr: Semaines }
                - value: mo
                  label: { en: Months, fr: Mois }
                - value: y
                  label: { en: Years, fr: Ans }
        asNeeded:
          label: { en: As needed, fr: Si besoin }
          type: checkbox
          canBeNull: true
        note:
          label: { en: Regimen as written, fr: Posologie telle qu'écrite }
          type: text
          canBeNull: true
  repeatable: unlimited
  devNotes: >-
    Content carries an `intake` sub-object with the same structure as `medication/coded-v1`:
    optional dose, route, frequency, asNeeded, note and timing (timeOfDay or when, bounds). The
    regimen is spelled exactly as `medication/prescription-v1` `posology` (site-agents#31, DM-4), so
    an intake and a prescription carry the same regimen the same way (FHIR Dosage.timing.repeat,
    asNeeded, text). An event without duration is one intake (status, skipReason; only dose and
    route of `intake` are meaningful); an event with a duration is a period of use (stopReason).
    The form shows neither the timing nor the status fields: app-flow fields, labelled by the
    medication vocabularies (MEDICATION.md).

medication-intake-coded:
  version: v1
  label:
    en: Medication Intake (coded)
    fr: Prise de médicament (codée)
  description:
    en: Search and select a coded medication.
    fr: Recherchez et sélectionnez un médicament codé.
  streamId: medication-intake
  eventType: medication/coded-v1
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 1576800000 # 50 years (site-agents#32): lifelong regimens. UI hint only, not validated. Ongoing use is duration null, not a long span.
  type: datasource-search
  datasource: medication
  repeatable: unlimited
  devNotes: >-
    Populated from datasets-service. At least one code (`drug.codes` minItems 1, 3.46.0): a
    medication no code was found for is medication-intake-basic, never a coded event with codes: [].

medication-prescription-coded:
  version: v1
  label:
    en: Medication Prescription (coded)
    fr: Prescription de médicament (codée)
  description:
    en: A medication your doctor prescribed, with dose and frequency.
    fr: Un médicament prescrit par votre médecin, avec la dose et la fréquence.
  streamId: medication-prescription
  eventType: medication/prescription-v1
  type: datasource-search
  datasource: medication
  repeatable: unlimited
  devNotes: >-
    Populated from datasets-service. At least one code (`drug.codes` minItems 1, 3.46.0): a
    prescription no code was found for is medication-prescription-basic. A point event
    (authoredOn); the course is posology.bounds, the state of the order is status.

medication-prescription-basic:
  version: v1
  label:
    en: Medication Prescription Basic
    fr: Prescription de médicament (simple)
  description:
    en: A medication your doctor prescribed, entered by its name, with dose and frequency.
    fr: Un médicament prescrit par votre médecin, saisi par son nom, avec la dose et la fréquence.
  streamId: medication-prescription
  eventType: medication/prescription-basic-v1
  type: composite
  composite:
    name:
      label: { en: Name of the medication, fr: Nom du médicament }
      type: text
    posology:
      label: { en: Posology, fr: Posologie }
      type: composite
      canBeNull: true
      composite: *medication-regimen-fields
  repeatable: unlimited
  devNotes: >-
    The uncoded twin of medication-prescription-coded, as medication-intake-basic is of
    medication-intake-coded: a name no code was found for (MEDICATION.md). Never a coded event
    with codes: []. Same stream as the coded twin, so one consent unit covers both. A
    prescription is a point event (authoredOn); its course is posology.bounds. The form shows
    the fields of medication-intake-basic.intake; timing and status are app-flow fields.
