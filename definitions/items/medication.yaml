medication-intake-basic:
  version: v3
  label:
    en: Medication Intake Basic
    fr: Prise de médicament (simple)
  description:
    en: A medication you took, entered as free text.
    fr: Un médicament que vous avez pris, saisi en texte libre.
  streamId: medication-intake
  eventType: medication/basic
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 1576800000 # 50 years (site-agents#32): lifelong regimens. UI hint only, not validated. Ongoing use is duration null, not a long span.
  type: composite
  composite:
    name:
      label: Name of the medication
      type: text
    intake:
      label: Intake
      type: composite
      canBeNull: true
      composite:
        doseValue:
          label: Dose amount
          type: number
          canBeNull: true
        doseUnit:
          label: Dose unit
          type: select
          canBeNull: true
          options:
            - value: dose/tablet
              label: { en: Tablet, fr: Comprimé }
            - value: dose/drop
              label: { en: Drop, fr: Goutte }
            - value: dose/puff
              label: { en: Puff, fr: Bouffée }
            - value: dose/application
              label: { en: Application, fr: Application }
            - value: dose/suppository
              label: { en: Suppository, fr: Suppositoire }
            - value: dose/unit
              label: { en: Unit (IU), fr: Unité (UI) }
            - value: mass/mg
              label: { en: mg, fr: mg }
            - value: mass/mcg
              label: { en: μg, fr: μg }
            - value: volume/ml
              label: { en: ml, fr: ml }
        route:
          label: Route of administration
          type: select
          canBeNull: true
          options:
            - value: oral
              label: { en: Oral, fr: Oral }
            - value: sublingual
              label: { en: Sublingual, fr: Sublingual }
            - value: topical
              label: { en: Topical, fr: Topique }
            - value: transdermal
              label: { en: Transdermal, fr: Transdermique }
            - value: inhalation
              label: { en: Inhalation, fr: Inhalation }
            - value: nasal
              label: { en: Nasal, fr: Nasal }
            - value: rectal
              label: { en: Rectal, fr: Rectal }
            - value: vaginal
              label: { en: Vaginal, fr: Vaginal }
            - value: ophthalmic
              label: { en: Ophthalmic, fr: Ophtalmique }
            - value: otic
              label: { en: Otic (ear), fr: Auriculaire }
            - value: intravenous
              label: { en: Intravenous (IV), fr: Intraveineux (IV) }
            - value: intramuscular
              label: { en: Intramuscular (IM), fr: Intramusculaire (IM) }
            - value: subcutaneous
              label: { en: Subcutaneous (SC), fr: Sous-cutané (SC) }
        frequency:
          label: { en: How often, fr: Fréquence }
          type: composite
          canBeNull: true
          composite:
            times:
              label: { en: Times, fr: Fois }
              type: number
              canBeNull: true
            period:
              label: { en: Every, fr: Tous les }
              type: number
              canBeNull: true
            periodUnit:
              label: { en: Period, fr: Période }
              type: select
              canBeNull: true
              options:
                - value: h
                  label: { en: Hours, fr: Heures }
                - value: d
                  label: { en: Days, fr: Jours }
                - value: wk
                  label: { en: Weeks, fr: Semaines }
                - value: mo
                  label: { en: Months, fr: Mois }
                - value: y
                  label: { en: Years, fr: Ans }
        asNeeded:
          label: { en: As needed, fr: Si besoin }
          type: checkbox
          canBeNull: true
        note:
          label: { en: Regimen as written, fr: Posologie telle qu'écrite }
          type: text
          canBeNull: true
  repeatable: unlimited
  devNotes: >-
    Content carries an `intake` sub-object with the same structure as `medication/coded-v1`:
    optional dose, route, frequency, asNeeded and note. `frequency`, `asNeeded` and `note` are
    spelled exactly as `medication/prescription-v1` `posology` (site-agents#31), so an intake and
    a prescription carry the same regimen the same way (FHIR Dosage.timing.repeat, asNeeded, text).

medication-intake-coded:
  version: v1
  label:
    en: Medication Intake (coded)
    fr: Prise de médicament (codée)
  description:
    en: Search and select a coded medication.
    fr: Recherchez et sélectionnez un médicament codé.
  streamId: medication-intake
  eventType: medication/coded-v1
  duration:
    mandatory: false
    canBeNull: true
    maxSeconds: 1576800000 # 50 years (site-agents#32): lifelong regimens. UI hint only, not validated. Ongoing use is duration null, not a long span.
  type: datasource-search
  datasource: medication
  repeatable: unlimited
  devNotes: >-
    Populated from datasets-service.

medication-prescription-coded:
  version: v1
  label:
    en: Medication Prescription (coded)
    fr: Prescription de médicament (codée)
  description:
    en: A medication your doctor prescribed, with dose and frequency.
    fr: Un médicament prescrit par votre médecin, avec la dose et la fréquence.
  streamId: medication-prescription
  eventType: medication/prescription-v1
  type: datasource-search
  datasource: medication
  repeatable: unlimited
