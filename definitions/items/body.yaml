body-weight:
  version: v1
  label:
    en: Body weight
    fr: Poids corporel
  description:
    en: Your measured body weight.
    fr: Votre poids corporel mesuré.
  streamId: body-weight
  type: number
  variations:
    eventType:
      label:
        en: Unit
        fr: Unité
      options:
        - value: mass/kg
          label:
            en: kg
            fr: kg
        - value: mass/lb
          label:
            en: Lbs
            fr: Livres
  repeatable: unlimited
  reminder:
    cooldown: P1D
  references:
    snomed: ["27113001"]
  fhir:
    resourceType: Observation
    category: vital-signs
    code: { system: http://loinc.org, code: 29463-7, display: Body weight }
    # Import only: EHRs often send the "measured" variant.
    alsoMatch:
      - { system: http://loinc.org, code: 3141-9, display: Body weight Measured }
    value:
      kind: quantity
      units:
        mass/kg: kg
        mass/lb: "[lb_av]"
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-body-weight
      ips: http://hl7.org/fhir/StructureDefinition/bodyweight
body-blood-pressure:
  version: v1
  label:
    en: Blood pressure
    fr: Tension artérielle
  description:
    en: Blood pressure measurement — systolic / diastolic in mmHg, optional pulse in bpm.
    fr: Mesure de la tension artérielle — systolique / diastolique en mmHg, pouls optionnel en bpm.
  streamId: body-blood-pressure
  eventType: blood-pressure/mmhg-bpm
  type: composite
  composite:
    systolic:
      label:
        en: Systolic
        fr: Systolique
      type: number
    diastolic:
      label:
        en: Diastolic
        fr: Diastolique
      type: number
    rate:
      label:
        en: Pulse
        fr: Pouls
      type: number
      canBeNull: true
  repeatable: unlimited
  references:
    snomed: ["75367002", "271649006", "271650006"]
    loinc: ["85354-9", "8480-6", "8462-4"]
  fhir:
    resourceType: Observation
    category: vital-signs
    code: { system: http://loinc.org, code: 85354-9, display: Blood pressure panel with all children optional }
    # Import only: older sources (Synthea 2019, the SMART sandbox data) code every panel 55284-4, which
    # LOINC now marks DISCOURAGED in favour of 85354-9. Same two components.
    alsoMatch:
      - { system: http://loinc.org, code: 55284-4, display: Blood pressure systolic and diastolic }
    value:
      kind: components
      components:
        systolic: { code: { system: http://loinc.org, code: 8480-6, display: Systolic blood pressure }, unit: "mm[Hg]" }
        diastolic: { code: { system: http://loinc.org, code: 8462-4, display: Diastolic blood pressure }, unit: "mm[Hg]" }
    split:
      rate:
        code: { system: http://loinc.org, code: 8867-4, display: Heart rate }
        unit: /min
        profiles:
          us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-heart-rate
          ips: http://hl7.org/fhir/StructureDefinition/heartrate
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-blood-pressure
      ips: http://hl7.org/fhir/StructureDefinition/bp
body-temperature-basal:
  version: v1
  label:
    en: Basal Body Temperature
    fr: Température basale
  description:
    en: Your resting temperature, taken on waking before any activity.
    fr: Votre température au repos, prise au réveil avant toute activité.
  streamId: body-temperature-basal
  eventType: temperature/c
  type: number
  repeatable: unlimited
  references:
    snomed: ["300076005"]
  devNotes: >-
    Used for fertility charting (coverline and thermal shift). See
    `body-temperature-basal-disturbance` for flagging a reading as unreliable.
# Sympto-thermal rules EXCLUDE a disturbed reading from the coverline and the
# temperature-shift computation, so a consumer charting BBT cannot read the curve
# correctly without the flag. Cycle Féminin exports it
# (`codifiedEvents: ["Parasitic temperature"]` + `codifiedTemperatureParasitic`);
# both the HDS importer and the PHP samples dropped it and wrote the temperature
# as if reliable — silently wrong for anyone computing a shift. (site-agents#14)
#
# Modelled as a companion item on its own stream, the same shape as
# body-vulva-bleeding-browndark / -clots ("Qualifier for a co-occurring ... event"),
# rather than as an event-level qualifier on the temperature itself: Plan 85 (D4,
# 2026-07-16) decided HDS does not encode observation qualifiers in the root model,
# and no such mechanism exists.
#
# Generic on purpose — FEMM, Billings, Creighton and Mira all have a comparable
# disturbance notion, so one item serves several bridges instead of each inventing
# its own.
body-temperature-basal-disturbance:
  version: v1
  label:
    en: Basal temperature disturbance
    fr: Perturbation de la température basale
  description:
    en: Why this basal temperature reading may be unreliable.
    fr: Pourquoi cette mesure de température basale peut être peu fiable.
  streamId: body-temperature-basal-disturbance
  eventType: temperature/disturbance-v1
  type: select
  options:
    - value: rough-night
      label: { en: Rough night, fr: Nuit agitée }
    - value: illness-fever
      label: { en: Illness or fever, fr: Maladie ou fièvre }
    - value: alcohol
      label: { en: Alcohol, fr: Alcool }
    - value: late-or-short-sleep
      label: { en: Late or short sleep, fr: Sommeil tardif ou trop court }
    - value: different-time
      label: { en: Measured at a different time, fr: Mesure prise à une heure inhabituelle }
    - value: travel-timezone
      label: { en: Travel or time-zone change, fr: Voyage ou changement de fuseau horaire }
    - value: other
      label: { en: Other, fr: Autre }
  repeatable: unlimited
  devNotes: >-
    A "parasitic temperature" qualifier for a co-occurring `body-temperature-basal` event: a
    reader should exclude the flagged reading from coverline and thermal-shift computation.
    Absence means the reading was not flagged, NOT that it was confirmed reliable.
# Vital signs printed on letters and reports, or measured by a device (site-agents#30). The basal
# fertility reading stays `body-temperature-basal`; this is any other measured body temperature, on
# the parent stream, so the pair (body-temperature, temperature/c) differs from the basal one.
body-heart-rate:
  version: v1
  label:
    en: Heart rate
    fr: Fréquence cardiaque
  description:
    en: Your measured heart rate, in beats per minute.
    fr: Votre fréquence cardiaque mesurée, en battements par minute.
  streamId: body-heart-rate
  eventType: frequency/bpm
  type: number
  repeatable: unlimited
  references:
    snomed: ["364075005"]
    loinc: ["8867-4"]
  devNotes: >-
    The pulse taken with a blood pressure reading stays in `body-blood-pressure` (`rate`);
    this item is a heart rate recorded on its own.
  # The same code as the blood-pressure `split.rate`, which renders the pulse of a reading. On import a
  # standalone 8867-4 matches this item directly, and a direct match wins over a split match.
  fhir:
    resourceType: Observation
    category: vital-signs
    code: { system: http://loinc.org, code: 8867-4, display: Heart rate }
    value:
      kind: quantity
      units:
        frequency/bpm: /min
    profiles:
      us: http://hl7.org/fhir/us/core/StructureDefinition/us-core-heart-rate
      ips: http://hl7.org/fhir/StructureDefinition/heartrate
body-oxygen-saturation:
  version: v1
  label:
    en: Oxygen saturation (SpO2)
    fr: Saturation en oxygène (SpO2)
  description:
    en: How much oxygen your blood carries, as a percentage.
    fr: La quantité d'oxygène transportée par votre sang, en pourcentage.
  streamId: body-oxygen-saturation
  eventType: ratio/proportion
  type: number
  repeatable: unlimited
  number:
    display: { multiplier: 100, suffix: { en: "%", fr: "%" } }
  references:
    snomed: ["431314004"]
    loinc: ["2708-6", "59408-5"]
  devNotes: >-
    Stored as a proportion (0.97 for 97 %). LOINC codes as the FHIR vital-signs profile pairs them:
    2708-6 first (the profile's primary oxygen-saturation code), then 59408-5 (by pulse oximetry).
body-temperature:
  version: v1
  label:
    en: Body temperature
    fr: Température corporelle
  description:
    en: Your measured body temperature.
    fr: Votre température corporelle mesurée.
  streamId: body-temperature
  eventType: temperature/c
  type: number
  repeatable: unlimited
  references:
    snomed: ["386725007"]
    loinc: ["8310-5"]
  devNotes: >-
    Any measured body temperature except the basal fertility reading, which stays
    `body-temperature-basal`. A grant on `body-temperature` also covers the basal child.
body-height:
  version: v1
  label:
    en: Body height
    fr: Taille
  description:
    en: Your measured height.
    fr: Votre taille mesurée.
  streamId: body-height
  type: number
  variations:
    eventType:
      label:
        en: Unit
        fr: Unité
      options:
        - value: length/m
          label:
            en: m
            fr: m
        - value: length/ft
          label:
            en: Feet
            fr: Pieds
  repeatable: unlimited
  references:
    snomed: ["1153637007"]

body-semen-concentration:
  version: v1
  label:
    en: Sperm concentration
    fr: Concentration spermatique
  description:
    en: Number of spermatozoa per millilitre of ejaculate.
    fr: Nombre de spermatozoïdes par millilitre d'éjaculat.
  streamId: body-semen-concentration
  eventType: concentration/megacount-ml
  type: number
  repeatable: any
  # Semen analysis reports concentration in 10⁶/mL (WHO manual); the eventType's own symbol is
  # G/L (the same number), which reads as a blood count, so the item keeps the semen notation.
  # hds-forms-js NumberInput honours this suffix. hds-lib eventToShortText (formatNumber) does
  # not read number.display for `type: number` items yet, so it prints "15 G/L" here until it does.
  number:
    display:
      suffix: { en: 10⁶/mL, fr: 10⁶/mL }
  # referenceRange parked pending direct verification against the WHO 2021 manual (6th ed., Geneva 2021).
  # Secondary sources cite 16 M#/mL but the most rigorous SWOT review (Boitrelle 2021) tabulates total
  # sperm number (39 M#/ejaculate) instead, not concentration. See research.md §2.4. Re-add when verified.
  # LOINC mapping (commonly cited 32623-1) also pending separate verification.
  referenceRange: null
  references:
    snomed: ["713521005"]
  devNotes: >-
    Stored on `concentration/megacount-ml` (10⁶/mL).
body-semen-motility-progressive:
  version: v1
  label:
    en: Sperm motility — progressive (PR)
    fr: Mobilité spermatique — progressive (PR)
  description:
    en: Fraction of spermatozoa moving actively forward.
    fr: Fraction de spermatozoïdes se déplaçant activement vers l'avant.
  streamId: body-semen-motility-progressive
  eventType: ratio/proportion
  type: number
  repeatable: any
  referenceRange:
    source: WHO-2021
    lowerLimit: 0.30
    upperLimit: null
    units: ratio
    population: recently-fertile-men
  devNotes: >-
    Progressive motility (PR): moving in a straight line or a large circle, regardless of speed.
    Distinct from total motility (PR+NP). It is the multiplier in the Total Motile Count
    derivation (concentration × volume × this). Reference: WHO 2021, lower limit 0.30.
body-semen-motility-total:
  version: v1
  label:
    en: Sperm motility — total (PR+NP)
    fr: Mobilité spermatique — totale (PR+NP)
  description:
    en: Fraction of moving spermatozoa in semen.
    fr: Fraction de spermatozoïdes mobiles dans le sperme.
  streamId: body-semen-motility-total
  eventType: ratio/proportion
  type: number
  repeatable: any
  references:
    snomed: ["252048002"]
  referenceRange:
    source: WHO-2021
    lowerLimit: 0.42
    upperLimit: null
    units: ratio
    population: recently-fertile-men
  devNotes: >-
    Progressive (PR) plus non-progressive (NP). Used to diagnose asthenozoospermia. Distinct
    from `body-semen-motility-progressive` (PR only); both can appear on the same lab report.
    Reference: WHO 2021, lower limit 0.42.
body-semen-vitality:
  version: v1
  label:
    en: Sperm vitality
    fr: Vitalité spermatique
  description:
    en: Fraction of live spermatozoa in semen.
    fr: Fraction de spermatozoïdes vivants dans le sperme.
  streamId: body-semen-vitality
  eventType: ratio/proportion
  type: number
  repeatable: any
  referenceRange:
    source: WHO-2021
    lowerLimit: 0.54
    upperLimit: null
    units: ratio
    population: recently-fertile-men
  devNotes: >-
    Measured by eosin-nigrosin staining or the hypo-osmotic swelling test. Distinct from
    motility: a spermatozoon can be alive but immotile. WHO 2021 makes this a mandatory test
    when total motility is below the reference limit, because it discriminates asthenozoospermia
    (low motility, mostly live) from necrozoospermia (low motility, mostly dead). Reference: WHO
    2021, lower limit 0.54.
body-semen-volume:
  version: v1
  label:
    en: Semen volume
    fr: Volume de sperme
  description:
    en: Volume of semen in a single ejaculate, in millilitres.
    fr: Volume de sperme dans un éjaculat unique, en millilitres.
  streamId: body-semen-volume
  eventType: volume/ml
  type: number
  repeatable: any
  # LOINC mapping (commonly cited 11250-3) pending separate verification.
  referenceRange:
    source: WHO-2021
    lowerLimit: 1.4
    upperLimit: null
    units: ml
    population: recently-fertile-men
body-semen-tmc:
  version: v1
  label:
    en: Total motile count
    fr: Nombre total de spermatozoïdes mobiles
  description:
    en: Total number of moving spermatozoa in one ejaculate.
    fr: Nombre total de spermatozoïdes mobiles dans un éjaculat.
  streamId: body-semen-tmc
  eventType: count/mega
  type: number
  repeatable: any
  # WHO 2021 deliberately does not publish a TMC reference limit. Threshold below is clinical consensus
  # (Hamilton et al. 2015, Hum Reprod) — IUI viability cutoff. See research.md §2.2.
  referenceRange:
    source: Hamilton-2015
    lowerLimit: 9
    upperLimit: null
    units: M#/ejaculate
    population: clinical-consensus
  references:
    snomed: ["167806003"]
  devNotes: >-
    Clinically derived as concentration × volume × progressive-motility fraction, but stored as
    a measured value on `count/mega` (10⁶ sperm) because labs report it directly. Reference:
    Hamilton 2015, lower limit 9.
body-semen-morphology-normal:
  version: v1
  label:
    en: Normal-form sperm morphology
    fr: Morphologie normale des spermatozoïdes
  description:
    en: Fraction of spermatozoa with a normal shape.
    fr: Fraction de spermatozoïdes de forme normale.
  streamId: body-semen-morphology-normal
  eventType: ratio/proportion
  type: number
  repeatable: any
  # LOINC mapping (commonly cited 10210-3) pending separate verification.
  referenceRange:
    source: WHO-2021
    lowerLimit: 0.04
    upperLimit: null
    units: ratio
    population: recently-fertile-men
  references:
    snomed: ["250500000"]
  devNotes: >-
    Kruger strict criteria. Stored on `ratio/proportion` as 0..1. Reference: WHO 2021, lower
    limit 0.04.
body-semen-dna-fragmentation:
  version: v1
  label:
    en: Sperm DNA fragmentation
    fr: Fragmentation de l'ADN spermatique
  description:
    en: Fraction of spermatozoa with fragmented DNA.
    fr: Fraction de spermatozoïdes dont l'ADN est fragmenté.
  streamId: body-semen-dna-fragmentation
  eventType: ratio/proportion
  type: number
  repeatable: any
  # WHO 2021 explicitly defers on DFI (no reference limit). Threshold below is clinical consensus
  # (Agarwal 2017, Society for Translational Medicine) for elevated DNA-fragmentation risk.
  # See research.md §2.2. Note this is an UPPER limit (high values = worse), unlike the others.
  referenceRange:
    source: Agarwal-2017
    lowerLimit: null
    upperLimit: 0.30
    units: ratio
    population: clinical-consensus
  devNotes: >-
    DNA Fragmentation Index (DFI). Stored on `ratio/proportion` as 0..1. Reference: Agarwal
    2017, upper limit 0.30.

# ─────────────────────────────────────────────────────────────────────────────
# Blood chemistry — see documentation/BLOOD-CHEMISTRY.md
#
# Specimen is explicit in every key (body-blood-serum-*, body-urine-hormones-*): serum and
# urine assays of the same hormone are different observations with different reference
# ranges, and SNOMED codes them as distinct procedures.
#
# Reference ranges are deliberately absent. They vary by lab, assay and population, and
# "optimal" bands are a practice's interpretation, not a fact about the analyte. The model
# carries the measured value; interpretation stays with the interpreter.
# ─────────────────────────────────────────────────────────────────────────────

body-blood-serum-glucose-fasting:
  version: v1
  label:
    en: Fasting glucose
    fr: Glycémie à jeun
  description:
    en: Blood sugar, measured after not eating overnight.
    fr: Taux de sucre dans le sang, mesuré après une nuit sans manger.
  streamId: body-blood-serum-glucose-fasting
  type: number
  repeatable: any
  # Fasting is its own item rather than a variation: SNOMED codes fasting (167087006) and
  # random (167086002) serum glucose as different procedures, and the schema's `variations`
  # block only supports eventType. Precedent: body-temperature-basal vs body-temperature.
  variations:
    eventType:
      label:
        en: Unit
        fr: Unité
      options:
        - value: concentration/mg-dl
          label:
            en: mg/dL
            fr: mg/dL
        - value: concentration/mmol-l
          label:
            en: mmol/L
            fr: mmol/L
  unitConversions:
    factors:
      - from: concentration/mg-dl
        to: concentration/mmol-l
        factor: 0.05551
        molarMass: 180.16
        source: "Molar mass of glucose, C6H12O6, 180.16 g/mol (PubChem CID 5793; IUPAC standard atomic weights)"
  references:
    snomed: ["167087006"]

body-blood-serum-insulin-fasting:
  version: v1
  label:
    en: Fasting insulin
    fr: Insuline à jeun
  description:
    en: The hormone that moves sugar into your cells, measured after not eating overnight.
    fr: L'hormone qui fait entrer le sucre dans vos cellules, mesurée après une nuit sans manger.
  streamId: body-blood-serum-insulin-fasting
  type: number
  repeatable: any
  variations:
    eventType:
      label: { en: Unit, fr: Unité }
      options:
        - { value: concentration/uiu-ml, label: { en: μIU/mL, fr: μIU/mL } }
        - { value: concentration/pmol-l, label: { en: pmol/L, fr: pmol/L } }
  unitConversions:
    notConvertible:
      - from: concentration/uiu-ml
        to: concentration/pmol-l
        reason: "Insulin units are defined by an international standard, and the factor to pmol/L depends on how the assay is calibrated (6.0 and 6.945 are both in use). Stored as printed, never compared across units."
  # 16890009 is the unqualified insulin measurement; SNOMED has no fasting-specific concept.
  references:
    snomed: ["16890009"]

body-blood-hba1c:
  version: v1
  label:
    en: HbA1c
    fr: HbA1c
  description:
    en: Your average blood sugar over the past two to three months.
    fr: Votre glycémie moyenne des deux à trois derniers mois.
  streamId: body-blood-hba1c
  eventType: ratio/proportion
  type: number
  repeatable: any
  # HbA1c is the glycated fraction of total hemoglobin — a real fraction, so it stores 0..1
  # and renders as a percentage. Specimen is whole blood, not serum, hence the direct
  # placement under body-blood rather than body-blood-serum.
  number:
    display:
      multiplier: 100
      suffix:
        en: "%"
        fr: "%"
  references:
    snomed: ["43396009"]

body-blood-serum-c-peptide:
  version: v1
  label:
    en: C-peptide
    fr: Peptide C
  description:
    en: Shows how much insulin your body is making on its own.
    fr: Indique la quantité d'insuline que votre corps produit lui-même.
  streamId: body-blood-serum-c-peptide
  eventType: concentration/ug-l
  type: number
  repeatable: any
  number:
    display:
      suffix: { en: ng/mL, fr: ng/mL }
  # ng/mL is numerically identical to µg/L, so the legacy concentration/ug-l is used rather
  # than an equivalent twin. Stored and displayed values are the printed ng/mL number.
  references:
    snomed: ["88705004"]

body-blood-serum-fsh:
  version: v1
  label:
    en: FSH (serum)
    fr: FSH (sérum)
  description:
    en: Follicle-stimulating hormone in your blood.
    fr: Hormone folliculo-stimulante dans votre sang.
  streamId: body-blood-serum-fsh
  eventType: concentration/iu-l
  type: number
  repeatable: any
  references:
    snomed: ["273971007"]

body-blood-serum-lh:
  version: v1
  label:
    en: LH (serum)
    fr: LH (sérum)
  description:
    en: Luteinizing hormone in your blood.
    fr: Hormone lutéinisante dans votre sang.
  streamId: body-blood-serum-lh
  eventType: concentration/iu-l
  type: number
  repeatable: any
  references:
    snomed: ["273969007"]

body-blood-serum-estradiol:
  version: v1
  label:
    en: Estradiol
    fr: Estradiol
  description:
    en: The main estrogen in your blood.
    fr: Le principal œstrogène dans votre sang.
  streamId: body-blood-serum-estradiol
  type: number
  repeatable: any
  variations:
    eventType:
      label: { en: Unit, fr: Unité }
      options:
        - { value: concentration/pg-ml, label: { en: pg/mL, fr: pg/mL } }
        - { value: concentration/pmol-l, label: { en: pmol/L, fr: pmol/L } }
  unitConversions:
    factors:
      - from: concentration/pg-ml
        to: concentration/pmol-l
        factor: 3.671
        molarMass: 272.39
        source: "Molar mass of estradiol, C18H24O2, 272.39 g/mol (PubChem CID 5757; IUPAC standard atomic weights)"
  references:
    snomed: ["166448005"]

body-blood-serum-amh:
  version: v1
  label:
    en: AMH
    fr: AMH
  description:
    en: A marker of how many eggs your ovaries still hold.
    fr: Un marqueur du nombre d'ovocytes encore présents dans vos ovaires.
  streamId: body-blood-serum-amh
  type: number
  repeatable: any
  variations:
    eventType:
      label: { en: Unit, fr: Unité }
      options:
        - { value: concentration/ug-l, label: { en: ng/mL, fr: ng/mL } }
        - { value: concentration/pmol-l, label: { en: pmol/L, fr: pmol/L } }
  # ng/mL ≡ µg/L, so the legacy concentration/ug-l is used rather than an equivalent twin. The
  # option label carries "ng/mL" (an item-level number.display.suffix would also label the SI option).
  references:
    snomed: ["711358004"]

# ── Iron studies ─────────────────────────────────────────────────────────────

body-blood-serum-ferritin:
  version: v1
  label: { en: Ferritin, fr: Ferritine }
  description:
    en: Iron stored in your body.
    fr: Le fer stocké dans votre corps.
  streamId: body-blood-serum-ferritin
  eventType: concentration/ug-l
  type: number
  repeatable: any
  number:
    display:
      suffix: { en: ng/mL, fr: ng/mL }
  # ng/mL ≡ µg/L — the legacy unit is used rather than an equivalent twin.
  references:
    snomed: ["269821003"]

body-blood-serum-iron:
  version: v1
  label: { en: Iron, fr: Fer }
  description:
    en: Iron circulating in your blood.
    fr: Le fer circulant dans votre sang.
  streamId: body-blood-serum-iron
  eventType: concentration/mcg-dl
  type: number
  repeatable: any
  references:
    snomed: ["250216004"]

body-blood-serum-tibc:
  version: v1
  label: { en: Total iron-binding capacity, fr: Capacité totale de fixation du fer }
  description:
    en: How much iron your blood could carry.
    fr: La quantité de fer que votre sang pourrait transporter.
  streamId: body-blood-serum-tibc
  eventType: concentration/mcg-dl
  type: number
  repeatable: any
  references:
    snomed: ["359979000"]

body-blood-serum-transferrin-saturation:
  version: v1
  label: { en: Transferrin saturation, fr: Saturation de la transferrine }
