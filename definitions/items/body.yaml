  description:
    en: A salt that keeps your body's fluids in balance.
    fr: Un sel qui maintient l'équilibre des liquides de votre corps.
  streamId: body-blood-serum-sodium
  eventType: concentration/mmol-l
  type: number
  repeatable: any
  references:
    snomed: ["104934005"]
    loinc: ["2951-2"]

body-blood-serum-potassium:
  version: v1
  label: { en: Potassium, fr: Potassium }
  description:
    en: A salt your nerves and heart need to work.
    fr: Un sel nécessaire au fonctionnement de vos nerfs et de votre cœur.
