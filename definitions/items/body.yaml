# ── Renal & electrolytes ─────────────────────────────────────────────────────

body-blood-serum-bun:
  version: v1
  label: { en: Blood urea nitrogen, fr: Azote uréique sanguin }
  description:
    en: A waste product your kidneys filter out.
    fr: Un déchet que vos reins éliminent.
  streamId: body-blood-serum-bun
  type: number
  repeatable: any
  variations:
    eventType:
      label: { en: Unit, fr: Unité }
      options:
        - { value: concentration/mg-dl, label: { en: mg/dL, fr: mg/dL }, loinc: "3094-0" }
        - { value: concentration/mmol-l, label: { en: Urea mmol/L, fr: Urée mmol/L }, loinc: "22664-7" }
  # mg/dL is urea NITROGEN (BUN); mmol/L is urea, which labs print as "urea" (one mole of urea carries
  # two nitrogen atoms, hence the factor). Urea printed in mg/dL (mass of urea, not of its nitrogen)
  # is NOT this item's mg/dL: it goes to lab-result/coded-v1 (BLOOD-CHEMISTRY.md § Units).
  unitConversions:
    factors:
      - from: concentration/mg-dl
        to: concentration/mmol-l
        factor: 0.3570
        molarMass: 28.014
        source: "Urea, CH4N2O (PubChem CID 1176), carries two nitrogen atoms: 1 mmol of urea holds 2 × 14.007 = 28.014 mg of nitrogen (IUPAC standard atomic weights)"
  references:
    snomed: ["105011006"]
    loinc: ["3094-0", "22664-7"]

body-blood-serum-creatinine:
  version: v1
  label: { en: Creatinine, fr: Créatinine }
  description:
    en: A waste product from your muscles that your kidneys filter out.
    fr: Un déchet produit par vos muscles que vos reins éliminent.
  streamId: body-blood-serum-creatinine
  type: number
  repeatable: any
  variations:
    eventType:
      label: { en: Unit, fr: Unité }
      options:
        - { value: concentration/mg-dl, label: { en: mg/dL, fr: mg/dL }, loinc: "2160-0" }
        - { value: concentration/umol-l, label: { en: μmol/L, fr: μmol/L }, loinc: "14682-9" }
  unitConversions:
    factors:
      - from: concentration/mg-dl
        to: concentration/umol-l
        factor: 88.4
        molarMass: 113.12
        source: "Molar mass of creatinine, C4H7N3O, 113.12 g/mol (PubChem CID 588; IUPAC standard atomic weights)"
  references:
    snomed: ["113075003"]
    loinc: ["2160-0", "14682-9"]

body-blood-serum-egfr:
  version: v1
  label: { en: eGFR, fr: DFGe }
  description:
    en: An estimate of how well your kidneys filter your blood.
    fr: Une estimation de la capacité de filtration de vos reins.
  streamId: body-blood-serum-egfr
  eventType: rate/ml-min-173m2
  type: number
  repeatable: any
  # 80274001 is an observable entity, not a procedure: SNOMED has no estimated-GFR
  # measurement procedure. The value is derived from creatinine via a named equation
  # (CKD-EPI, MDRD, …) chosen by the reporting lab — the equation is not modelled.
  references:
    snomed: ["80274001"]
    loincMethod: ["98979-8", "62238-1", "77147-7", "88293-6", "88294-4", "48643-1", "48642-3"]
  devNotes: >-
    LOINC codes eGFR per equation, and the equation changes the number, so the item exports no code and
    owns the creatinine-based ones (CKD-EPI 2021, CKD-EPI 2009, MDRD, and the race-adjusted CKD-EPI and
    MDRD codes labs still send). Cystatin-C-based results go to `lab-result/coded-v1`.

body-blood-serum-sodium:
  version: v1
