# ── Coagulation (citrated plasma) ─────────────────────────────────────────────

body-blood-coagulation-prothrombin-time:
  version: v1
  label: { en: Prothrombin time (PT), fr: Temps de Quick (TQ) }
  description:
    en: How long your blood takes to clot, in seconds.
    fr: Le temps que met votre sang à coaguler, en secondes.
  streamId: body-blood-coagulation-prothrombin-time
  eventType: time/s
  type: number
  repeatable: any
  references:
    snomed: ["396451008"]
    loinc: ["5902-2"]
    loincMethod: ["42638-7"]
  devNotes: >-
    In seconds. The same test printed as a percentage of normal (Quick, TP) is
    `body-blood-coagulation-prothrombin-activity`, and as a ratio the INR: neither converts to seconds,
    since the relation depends on the reagent (plan 114 Q17).

body-blood-coagulation-prothrombin-activity:
  version: v1
  label: { en: Prothrombin activity (Quick), fr: Taux de prothrombine (TP) }
  description:
    en: How well your blood clots, as a percentage of normal.
    fr: La capacité de votre sang à coaguler, en pourcentage de la normale.
  streamId: body-blood-coagulation-prothrombin-activity
  eventType: ratio/percent
  type: number
  repeatable: any
  number:
    display: { suffix: { en: "%", fr: "%" } }
  references:
    loincMethod: ["5894-1"]
  devNotes: >-
    Quick %, stored as printed: it exceeds 100 % (anticoagulant reversal, up to about 130 %), so
    `ratio/percent`, not `ratio/proportion` (plan 114 Q16). Owned, never exported: European catalogues send
    Quick % as LOINC 5894-1 (ELGA Laborparameter, the German MII top-300 lab set, an AP-HP TP profile), so a
    result coded that way lands here; but 5894-1 is "PT actual/Normal", a time ratio that runs the other
    way (a long PT is a ratio above 1 and a Quick below 100 %), so a reader of an export would misread the
    value. LOINC has no Quick % code. 6302-4 (normal/actual, the prothrombin index) and 3289-6 (factor II
    activity) are other analytes. No SNOMED reference: SNOMED CT has no prothrombin-activity concept.

body-blood-coagulation-aptt:
  version: v1
  label: { en: aPTT, fr: TCA }
  description:
    en: A clotting time that checks part of your clotting system.
    fr: Un temps de coagulation qui teste une partie de votre système de coagulation.
  streamId: body-blood-coagulation-aptt
  eventType: time/s
  type: number
  repeatable: any
  references:
    snomed: ["42525009"]
    loinc: ["14979-9"]
  devNotes: >-
    In seconds. The aPTT ratio (patient / control) is not an item: `lab-result/coded-v1` meanwhile.

body-blood-coagulation-fibrinogen:
  version: v1
  label: { en: Fibrinogen, fr: Fibrinogène }
  description:
    en: A protein your blood needs to form clots.
    fr: Une protéine dont votre sang a besoin pour former des caillots.
  streamId: body-blood-coagulation-fibrinogen
  type: number
  repeatable: any
  variations:
    eventType:
      label: { en: Unit, fr: Unité }
      options:
        - { value: concentration/mg-dl, label: { en: "mg/dL", fr: "mg/dL" }, loinc: "3255-7" }
        - { value: concentration/g-l, label: { en: "g/L", fr: "g/L" }, loinc: "3255-7" }
  unitConversions:
    factors:
      - from: concentration/mg-dl
        to: concentration/g-l
        factor: 0.01
        source: "Exact by the definition of the units: 1 mg/dL = 10 mg/L = 0.01 g/L (SI Brochure, 9th edition, BIPM 2019)"
  references:
    snomed: ["250346004"]
    loinc: ["3255-7"]

body-blood-coagulation-inr:
  version: v1
  label: { en: INR, fr: INR }
  description:
    en: How long your blood takes to clot compared with a standard, as a ratio (about 1 without blood thinners).
    fr: Le temps de coagulation de votre sang comparé à une référence, sous forme de rapport (environ 1 sans anticoagulant).
  streamId: body-blood-coagulation-inr
  eventType: ratio/generic
  type: number
  ratioRelativeTo: 1
  repeatable: any
  references:
    snomed: ["440685005"]
    loinc: ["6301-6"]
  devNotes: >-
    International normalized ratio. `ratio/generic` with an authored `ratioRelativeTo: 1` (plan 114 Q8): the
    content is `{ value: 2.5, relativeTo: 1 }`, never a bare number; a censored INR (`> 8`) keeps
    `clientData.hdsComparator`. 6301-6 is "by Coagulation assay" and LOINC has no methodless INR code. A home or
    point-of-care INR on capillary blood (34714-6, System Blood) is another specimen: `lab-result/coded-v1`.
    Not convertible to the prothrombin time or Quick %.


