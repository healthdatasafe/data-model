procedure-basic:
  version: v1
  label:
    en: Procedure (free-text)
    fr: Acte médical (texte libre)
  description:
    en: A clinical procedure, entered as free text.
    fr: Un acte médical, saisi en texte libre.
  streamId: procedure
  eventType: procedure/basic
  type: composite
  composite:
    name:
      label: Procedure name
      type: text
    count:
      label: Number of times (lifetime)
      type: number
      canBeNull: true
    notes:
      label: Notes
      type: text
      canBeNull: true
  repeatable: unlimited
  devNotes: >-
    Examples: laparoscopy, HSG, polypectomy.

procedure-coded:
  version: v1
  label:
    en: Procedure (coded)
    fr: Acte médical (codé)
  description:
    en: Search and select a coded clinical procedure.
    fr: Recherchez et sélectionnez un acte clinique codé.
  streamId: procedure
  eventType: procedure/coded-v1
  type: datasource-search
  datasource: procedure
  repeatable: unlimited
